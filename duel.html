function getVoterId(){
  let v = localStorage.getItem(VOTER_KEY);
  if(!v){
    v = (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID()
       : "sm-voter-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    localStorage.setItem(VOTER_KEY, v);
  }
  return v;
}
function getPicks(){
  try { return JSON.parse(localStorage.getItem(PICKS_KEY) || "{}"); } catch(e){ return {}; }
}
function setPick(key, winnerId){
  const p = getPicks(); p[key] = winnerId;
  localStorage.setItem(PICKS_KEY, JSON.stringify(p));
}
/* Deterministic daily shuffle: same 5 duels for everyone, all day. */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const a = arr.slice(), rnd = mulberry32(seed);
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildQueue(){
  const now = new Date();
  const seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  const shuffled = seededShuffle(DUELS, seed);
  const daily = shuffled.slice(0, 5);
  const rest = seededShuffle(shuffled.slice(5), seed + 1);
  return { daily, rest };
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadEntries(){
  const { data, error } = await client
    .from("mistakes").select("id,title,artwork_url").in("id", ALL_IDS);
  if(error) throw error;
  (data || []).forEach(r => { entries[r.id] = r; });
  const missing = ALL_IDS.filter(id => !entries[id]);
  if(missing.length) throw new Error("Missing entries: " + missing.join(", "));
}

async function loadCounts(duel){
  if(crowd[duel.key]) return crowd[duel.key];
  const { data, error } = await client
    .from("duel_picks").select("winner_id").eq("duel_key", duel.key);
  if(error){
    if(error.code === "42P01" || /relation .* does not exist/i.test(error.message || "")){
      tableMissing = true;
    }
    throw error;
  }
  let a = 0, b = 0;
  (data || []).forEach(r => {
    if(r.winner_id === duel.a.id) a++;
    else if(r.winner_id === duel.b.id) b++;
  });
  crowd[duel.key] = { a, b, total: a + b };
  return crowd[duel.key];
}

function renderStatus(){
  const total = queue.length;
  const done = Math.min(qi, 5);
  const picks = getPicks();
  let withCrowd = 0, counted = 0;
  queue.slice(0, 5).forEach(d => {
    const c = crowd[d.key], pick = picks[d.key];
    if(!c || !pick || c.total === 0) return;
    counted++;
    const maj = c.a > c.b ? d.a.id : (c.b > c.a ? d.b.id : null);
    if(maj && pick === maj) withCrowd++;
  });
  return { done, total, withCrowd, counted };
}

function contenderHtml(duel, side, pickedWinner){
  const c = duel[side];
  const e = entries[c.id] || {};
  const isPicked = pickedWinner === c.id;
  const isLoser = pickedWinner && !isPicked;
  return `<div class="contender ${isPicked ? "picked" : ""} ${isLoser ? "loser" : ""}">
    ${e.artwork_url ? `<img src="${esc(e.artwork_url)}" alt="${esc(e.title || "")}" onerror="this.style.display='none'">` : ""}
    <div class="body">
      <h3>${esc(e.title || "Loading…")}</h3>
      <div class="year">${c.year}</div>
      <p>${esc(c.line)}</p>
      ${pickedWinner
        ? (isPicked ? `<span class="yourpick">YOUR PICK</span>` : "")
        : `<button class="pick" data-side="${side}">This one was worse</button>`}
    </div>
  </div>`;
}

function renderDuel(){
  const duel = queue[qi];
  const app = document.getElementById("app");
  if(!duel){ renderEnd(); return; }
  const st = renderStatus();
  const pickedWinner = getPicks()[duel.key] || null;
  const isDaily = qi < 5;
  app.innerHTML = `
    <div class="hero">
      <h1>WHICH WAS <em>WORSE?</em></h1>
      <p>Two famous blunders. One pick. No wrong answers — but the crowd will judge you.</p>
    </div>
    <div class="statusbar">
      <span>${isDaily ? `Daily duel ${qi + 1} of 5` : `Bonus duel ${qi - 4} of ${queue.length - 5}`}</span>
      <span>${st.counted ? `With the crowd: ${st.withCrowd} of ${st.counted}` : `With the crowd: —`}</span>
    </div>
    <div class="card" id="duelCard">
      <div class="theme">${esc(duel.theme)}</div>
      <div class="question">${esc(duel.question)}</div>
      <div class="vs" id="vsBox">
        ${contenderHtml(duel, "a", pickedWinner)}
        ${contenderHtml(duel, "b", pickedWinner)}
      </div>
      <div id="resultBox"></div>
    </div>`;

  if(pickedWinner){
    showResult(duel, pickedWinner).catch(() => {});
  } else {
    app.querySelectorAll("button.pick").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        await pickSide(duel, btn.dataset.side);
      });
    });
  }
}

async function pickSide(duel, side){
  const winner = duel[side], loser = duel[side === "a" ? "b" : "a"];
  const voterId = getVoterId();
  /* Record locally first so a tap is never lost to a network error. */
  setPick(duel.key, winner.id);
  try {
    const { error } = await client.from("duel_picks").insert({
      duel_key: duel.key,
      winner_id: winner.id,
      loser_id: loser.id,
      voter_id: voterId
    });
    /* 23505 = this browser already has a row for this duel (unique index).
       That pick is already counted — just show the split. */
    if(error && error.code !== "23505") throw error;
  } catch(e){
    if(e && (e.code === "42P01" || /relation .* does not exist/i.test(e.message || ""))){
      tableMissing = true;
    } else {
      console.error("duel pick insert failed", e);
    }
  }
  delete crowd[duel.key]; /* recount including this pick */
  renderDuel();
}

async function showResult(duel, pickedWinner){
  const box = document.getElementById("resultBox");
  if(!box) return;
  const aTitle = (entries[duel.a.id] || {}).title || "";
  const bTitle = (entries[duel.b.id] || {}).title || "";
  const pickedTitle = pickedWinner === duel.a.id ? aTitle : bTitle;
  const otherTitle = pickedWinner === duel.a.id ? bTitle : aTitle;
  let counts = null;
  try { counts = await loadCounts(duel); } catch(e){ counts = null; }

  if(tableMissing || !counts){
    box.innerHTML = `
      <div class="notice">Your pick is saved: <b>${esc(pickedTitle)}</b>. The crowd split will appear here once the vote table is live — run <b>duel_picks.sql</b> in Supabase (see DUEL_DEPLOY.md), then reload.</div>
      <div class="actions">
        <button class="btn-next" id="nextBtn">${qi + 1 < queue.length ? "Next duel" : "See results"}</button>
        <button class="btn-share" id="shareBtn">Share this duel</button>
      </div>
      <div class="storylinks">
        <a href="mistake.html?id=${encodeURIComponent(duel.a.id)}">Read the full story: ${esc(aTitle)} &rarr;</a>
        <a href="mistake.html?id=${encodeURIComponent(duel.b.id)}">Read the full story: ${esc(bTitle)} &rarr;</a>
      </div>`;
  } else {
    const pctA = counts.total ? Math.round(counts.a / counts.total * 100) : 50;
    const pctB = 100 - pctA;
    const maj = counts.a > counts.b ? duel.a.id : (counts.b > counts.a ? duel.b.id : null);
    const withCrowd = maj && pickedWinner === maj;
    const verdict = counts.total === 0
      ? "You're the first to call this one."
      : (maj === null
        ? "Perfectly split. No crowd side — defend your pick."
        : (withCrowd
          ? `You sided with the crowd. ${pickedWinner === duel.a.id ? pctA : pctB}% agree with you.`
          : `You went against the crowd. Only ${pickedWinner === duel.a.id ? pctA : pctB}% agree with you — defend it.`));
    box.innerHTML = `
      <div class="split">
        <div class="splitbar">
          <div class="seg-a" style="width:${pctA}%">${pctA}%</div>
          <div class="seg-b" style="width:${pctB}%">${pctB}%</div>
        </div>
        <div class="splitlabels"><span>${esc(aTitle)}</span><span>${esc(bTitle)}</span></div>
      </div>
      <div class="verdict">${esc(verdict)}
        <small>${counts.total} ${counts.total === 1 ? "pick" : "picks"} so far</small>
      </div>
      <div class="actions">
        <button class="btn-next" id="nextBtn">${qi + 1 < queue.length ? "Next duel" : "See results"}</button>
        <button class="btn-share" id="shareBtn">Share this duel</button>
      </div>
      <div class="storylinks">
        <a href="mistake.html?id=${encodeURIComponent(duel.a.id)}">Read the full story: ${esc(aTitle)} &rarr;</a>
        <a href="mistake.html?id=${encodeURIComponent(duel.b.id)}">Read the full story: ${esc(bTitle)} &rarr;</a>
      </div>`;
  }

  document.getElementById("nextBtn").addEventListener("click", () => {
    qi++;
    if(qi === 5 && !dailyDone){ dailyDone = true; renderResults(); }
    else renderDuel();
  });
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const counts2 = counts;
    let text;
    if(counts2 && counts2.total > 0){
      const pct = pickedWinner === duel.a.id
        ? Math.round(counts2.a / counts2.total * 100)
        : Math.round(counts2.b / counts2.total * 100);
      text = `${pct}% say ${pickedTitle} was worse than ${otherTitle} — do you agree? ${SITE_URL}`;
    } else {
      text = `I picked ${pickedTitle} over ${otherTitle} — which was worse? ${SITE_URL}`;
    }
    await copyText(text, document.getElementById("shareBtn"));
  });
}

async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  if(btn){ const old = btn.textContent; btn.textContent = "Copied — paste it anywhere"; setTimeout(() => btn.textContent = old, 2500); }
}

function renderResults(){
  const app = document.getElementById("app");
  const picks = getPicks();
  const daily = queue.slice(0, 5);
  let withCrowd = 0, counted = 0;
  const rows = daily.map(d => {
    const c = crowd[d.key];
    const pick = picks[d.key];
    let line = "";
    if(c && pick && c.total > 0){
      counted++;
      const maj = c.a > c.b ? d.a.id : (c.b > c.a ? d.b.id : null);
      const side = pick === d.a.id ? "a" : "b";
      const pct = Math.round(c[side] / c.total * 100);
      if(maj && pick === maj) withCrowd++;
      line = `You picked <b>${esc((entries[pick] || {}).title || "")}</b> — ${pct}% of the crowd agrees${maj === null ? " (perfectly split)" : ""}.`;
    } else if(pick){
      line = `You picked <b>${esc((entries[pick] || {}).title || "")}</b>.`;
    } else {
      line = "Skipped.";
    }
    return `<div class="row"><b>${esc(d.question)}</b><span>${line}</span></div>`;
  }).join("");
  app.innerHTML = `
    <div class="hero"><h1>DAILY 5 <em>DONE.</em></h1>
    <p>${counted ? `You sided with the crowd on ${withCrowd} of ${counted} duels.` : "Your picks are in."} Come back tomorrow for a fresh five — or keep dueling now.</p></div>
    <div class="card results"><h2>Your verdicts</h2>${rows}
      <div class="actions">
        <button class="btn-next" id="keepBtn">Keep dueling (${queue.length - 5} more)</button>
        <button class="btn-share" id="shareAllBtn">Share my verdicts</button>
      </div>
    </div>`;
  document.getElementById("keepBtn").addEventListener("click", () => { renderDuel(); });
  document.getElementById("shareAllBtn").addEventListener("click", async () => {
    const lines = daily.map(d => {
      const pick = picks[d.key];
      if(!pick) return null;
      const other = pick === d.a.id ? d.b.id : d.a.id;
      return `I picked ${(entries[pick] || {}).title} over ${(entries[other] || {}).title}.`;
    }).filter(Boolean);
    await copyText(lines.join("\n") + `\nWhich was worse? ${SITE_URL}`, document.getElementById("shareAllBtn"));
  });
}

function renderEnd(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="hero"><h1>YOU DUELED <em>THEM ALL.</em></h1>
    <p>All 30 duels, called. Come back tomorrow for a fresh Daily 5.</p></div>
    <div class="card"><div class="actions">
      <button class="btn-next" id="againBtn">Run it again (reshuffled)</button>
      <a class="btn-share" style="text-align:center;text-decoration:none;padding:13px;border-radius:10px;font-weight:800;font-size:15px" href="index.html">Back to the archive</a>
    </div></div>`;
  document.getElementById("againBtn").addEventListener("click", () => {
    const { daily, rest } = buildQueue();
    queue = [...daily, ...seededShuffle(rest, Date.now())];
    qi = 0; dailyDone = false;
    renderDuel();
  });
}

(async function init(){
  try {
    await loadEntries();
    const { daily, rest } = buildQueue();
    queue = [...daily, ...rest];
    /* If this browser already finished today's Daily 5, jump to results. */
    const picks = getPicks();
    const doneDaily = daily.every(d => picks[d.key]);
    if(doneDaily && qi === 0){
      /* Preload counts so the results screen can score with-the-crowd. */
      for(const d of daily){ try { await loadCounts(d); } catch(e){} }
      qi = 5; dailyDone = true;
      renderResults();
      return;
    }
    renderDuel();
  } catch(e){
    console.error(e);
    document.getElementById("app").innerHTML =
      `<div class="error">Could not load the duels.<br><small>${esc(e.message || e)}</small><br><br>
       <button class="btn-share" onclick="location.reload()">Try again</button></div>`;
  }
})();
</script>
</body>
</html>
