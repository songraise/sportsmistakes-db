name: Update sitemap

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/update-sitemap.yml"

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap from Supabase
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap when changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is already current."
            exit 0
          fi

          git config user.name "sportsmistakes-sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Automatically update sitemap"
          git push
