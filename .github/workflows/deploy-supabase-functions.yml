name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.3

      - name: Deploy generate-artwork
        run: supabase functions deploy generate-artwork --project-ref scwjlljurircxuufhqih
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy submit-mistake
        run: supabase functions deploy submit-mistake --project-ref scwjlljurircxuufhqih --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy submit-court-argument
        run: supabase functions deploy submit-court-argument --project-ref scwjlljurircxuufhqih --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
