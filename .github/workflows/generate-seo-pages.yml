name: Generate SportsMistakes SEO Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static SEO pages
        run: node scripts/generate-seo-pages.mjs

      - name: Commit generated pages
        run: |
          git config user.name "sportsmistakes-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mistakes sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No SEO page changes."
          else
            git commit -m "Update static SEO pages"
            git push
          fi
