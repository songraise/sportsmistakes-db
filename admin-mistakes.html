  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}

    label{display:block;color:#d8e4f2;font-weight:bold;margin-bottom:6px;font-size:14px}textarea{width:100%;min-height:90px;resize:vertical}.form-grid input,.form-grid select{width:100%}.artwork-box{margin:14px 0;padding:14px;background:#07111f;border:1px solid #203852;border-radius:12px}.artwork-preview{width:100%;max-width:460px;max-height:300px;object-fit:cover;border-radius:10px;border:1px solid #304b69;display:block;margin-bottom:10px}.artwork-empty{color:#9fb2c7;font-style:italic;margin-bottom:8px}.artwork-status{color:#ffcc00;font-size:13px;white-space:pre-wrap;margin-top:8px}
    .court-admin-box{margin:16px 0;padding:16px;background:#07111f;border:1px solid #304b69;border-radius:12px}

    .court-status-pill.rejected{background:#5b1717;color:#ffaaaa}

    .court-edit-btn{background:#1e90ff}.court-hide-btn{background:#6b5b1e}.court-restore-btn{background:#166534}.court-delete-btn{background:#8b1e1e}
    .court-save-btn{background:#166534}.court-cancel-btn{background:#444}
    .court-section-status{color:#ffcc00;font-size:13px;white-space:pre-wrap;margin-top:8px}
    @media(max-width:760px){.form-grid{grid-template-columns:1fr}.top-nav{align-items:flex-start;flex-direction:column}.nav-links{gap:12px}.nav-links a{font-size:13px}}
  </style>
</head>
<body>
<nav class="top-nav">
  <div class="nav-brand" onclick="window.location.href='admin-dashboard.html'">Sports<span>Mistakes</span> Admin</div>
  <div class="nav-links">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="index.html">Public Site</a>
    <a href="admin-submissions.html">Submissions</a>
    <a href="admin-ai-review.html">AI Review</a>

<div class="container">
  <h1>Admin Mistakes</h1>
  <p class="sub">Search and edit existing SportsMistakes records, regenerate artwork, and moderate every Sports Court argument attached to each mistake.</p>

  <div class="admin-box">
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="Search title, teams, people, summary..." />
      <select id="sportFilter">
        <option value="">All Sports</option><option value="NFL">NFL</option><option value="NHL">NHL</option><option value="NBA">NBA</option><option value="MLB">MLB</option><option value="Soccer">Soccer</option><option value="Olympics">Olympics</option><option value="Tennis">Tennis</option><option value="Golf">Golf</option><option value="NCAA">NCAA</option><option value="F1">F1</option><option value="Boxing">Boxing</option>
      </select>
      <select id="categoryFilter">
        <option value="">All Categories</option><option value="Coaching Mistake">Coaching Mistake</option><option value="Referee Mistake">Referee Mistake</option><option value="Player Mistake">Player Mistake</option><option value="Front Office Mistake">Front Office Mistake</option><option value="Ownership Mistake">Ownership Mistake</option><option value="League Mistake">League Mistake</option><option value="Fan Interference">Fan Interference</option><option value="Team Mistake">Team Mistake</option>
      </select>
      <button class="search-btn" onclick="renderMistakes()">Search</button>
    </div>
    <div id="status" class="status">Checking admin access...</div>
  </div>

  <div id="mistakeList" class="mistake-list"></div>
</div>

<script>
  const SUPABASE_URL="https://scwjlljurircxuufhqih.supabase.co";
  const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjd2psbGp1cmlyY3h1dWZocWloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjUyMjcsImV4cCI6MjA5Njg0MTIyN30.WF0HRRb9mAkuOySjabTd8CZXVZRqF0MhMl0N2mafnns";
  const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

  async function logout(){
    await client.auth.signOut();
    window.location.href="admin-login.html";
  }

  let mistakes=[];
  let courtArguments=[];
  let courtArgumentsByMistake={};
  let courtReportCounts={};

  async function loadMistakes(){
    document.getElementById("status").innerText="Loading mistakes and Sports Court arguments...";

    const [mistakesResult,courtResult,reportsResult]=await Promise.all([
      client.from("mistakes").select("*").order("title",{ascending:true}),
      client.from("sports_court_arguments")
        .select("id,mistake_id,side,argument_text,author_name,status,upvotes,created_at")
        .order("created_at",{ascending:false}),
      client.from("sports_court_argument_reports")
        .select("argument_id")
    ]);

    if(mistakesResult.error){
      console.error(mistakesResult.error);
      document.getElementById("status").innerText="Could not load mistakes.";
      return;
    }

    if(courtResult.error){
      console.error(courtResult.error);
      document.getElementById("status").innerText="Mistakes loaded, but Sports Court arguments could not be loaded. Check admin table policies.";
    }

    mistakes=mistakesResult.data||[];
    courtArguments=courtResult.data||[];
    courtReportCounts={};

    (reportsResult.data||[]).forEach(report=>{
      courtReportCounts[report.argument_id]=(courtReportCounts[report.argument_id]||0)+1;
    });

    rebuildCourtArgumentMap();
    renderMistakes();
  }

  function rebuildCourtArgumentMap(){
    courtArgumentsByMistake={};
    courtArguments.forEach(argument=>{
      if(!courtArgumentsByMistake[argument.mistake_id]){
        courtArgumentsByMistake[argument.mistake_id]=[];
      }
      courtArgumentsByMistake[argument.mistake_id].push(argument);
    });

    Object.values(courtArgumentsByMistake).forEach(rows=>{
      rows.sort((a,b)=>{
        const aPriority=(a.status==="pending"?100:0)+(courtReportCounts[a.id]||0);
        const bPriority=(b.status==="pending"?100:0)+(courtReportCounts[b.id]||0);
        return bPriority-aPriority;
      });
    });
  }

  function renderMistakes(){
    const list=document.getElementById("mistakeList"),status=document.getElementById("status");
    const search=document.getElementById("searchInput").value.toLowerCase().trim();
    const sport=document.getElementById("sportFilter").value;
    const category=document.getElementById("categoryFilter").value;
    const filtered=mistakes.filter(m=>{
      const text=`${m.title||""} ${m.sport||""} ${m.category||""} ${m.subcategory||""} ${m.teams_people||""} ${m.summary||""} ${m.why_it_matters||""}`.toLowerCase();
      return (!search||text.includes(search))&&(!sport||m.sport===sport)&&(!category||m.category===category);
    });
    status.innerText=`${filtered.length} mistake${filtered.length===1?"":"s"} shown.`;
    list.innerHTML=filtered.slice(0,100).map(m=>renderMistakeRow(m)).join("");
    if(filtered.length>100)status.innerText+="\nShowing first 100 results. Search or filter to narrow the list.";
  }

  function renderMistakeRow(m){
    return `
      <div class="mistake-row" id="row-${m.id}">
        <div class="mistake-title">${escapeHtml(m.title||"Untitled Mistake")}</div>
        <div class="meta">${escapeHtml(m.sport||"")}${m.year?" • "+escapeHtml(m.year):""}${m.category?" • "+escapeHtml(m.category):""}${m.subcategory?" • "+escapeHtml(m.subcategory):""}${m.views?" • 👁 "+escapeHtml(m.views):""}</div>
        <div class="summary">${escapeHtml(m.summary||"No summary added.")}</div>
        <button class="open-btn" onclick="window.open('mistake.html?id=${m.id}','_blank')">Open</button>
        <button class="search-btn" onclick="toggleEdit('${m.id}')">Edit</button>
        <button class="art-btn" id="art-btn-${m.id}" onclick="regenerateArtwork('${m.id}','${escapeJs(m.title||"")}')">${m.artwork_url ? "Regenerate Artwork" : "Generate Artwork"}</button>
        <button class="delete-btn" onclick="deleteMistake('${m.id}','${escapeJs(m.title||"")}')">Delete</button>
        <div class="edit-form" id="edit-${m.id}">
          <div class="form-grid">
            <div><label>Title</label><input id="title-${m.id}" value="${escapeAttribute(m.title||"")}" /></div>
            <div><label>Sport</label><input id="sport-${m.id}" value="${escapeAttribute(m.sport||"")}" /></div>
            <div><label>Year</label><input id="year-${m.id}" value="${escapeAttribute(m.year||"")}" /></div>
            <div><label>Category</label><input id="category-${m.id}" value="${escapeAttribute(m.category||"")}" /></div>
            <div><label>Subcategory</label><input id="subcategory-${m.id}" value="${escapeAttribute(m.subcategory||"")}" /></div>
            <div><label>Controversy Score</label><input id="score-${m.id}" type="number" min="0" max="100" value="${escapeAttribute(m.controversy_score||0)}" /></div>
            <div class="form-full"><label>Teams / People</label><input id="teams-${m.id}" value="${escapeAttribute(m.teams_people||"")}" /></div>
            <div class="form-full">
              <label>Artwork</label>
              <div class="artwork-box" id="artwork-box-${m.id}">
                ${m.artwork_url ? `<img class="artwork-preview" src="${escapeAttribute(m.artwork_url)}" alt="Artwork for ${escapeAttribute(m.title||"Sports mistake")}" />` : `<div class="artwork-empty">No artwork currently attached.</div>`}
                <input id="artwork-${m.id}" value="${escapeAttribute(m.artwork_url||"")}" placeholder="Artwork URL" />
                <div class="artwork-status" id="artwork-status-${m.id}"></div>
              </div>
            </div>
            <div class="form-full">${renderCourtModerationSection(m.id)}</div>
            <div class="form-full"><label>Summary</label><textarea id="summary-${m.id}">${escapeHtml(m.summary||"")}</textarea></div>
            <div class="form-full"><label>Why It Matters</label><textarea id="why-${m.id}">${escapeHtml(m.why_it_matters||"")}</textarea></div>
            <div class="form-full"><label>Source 1</label><input id="source1-${m.id}" value="${escapeAttribute(m.source_1||"")}" /></div>
            <div class="form-full"><label>Source 2</label><input id="source2-${m.id}" value="${escapeAttribute(m.source_2||"")}" /></div>
          </div>
          <button class="save-btn" onclick="saveMistake('${m.id}')">Save Changes</button>
          <button class="cancel-btn" onclick="toggleEdit('${m.id}')">Cancel</button>
        </div>
      </div>`;
  }

  function renderCourtModerationSection(mistakeId){
    const rows=courtArgumentsByMistake[mistakeId]||[];
    const approvedCount=rows.filter(a=>(a.status||"approved")==="approved").length;
    const hiddenCount=rows.filter(a=>a.status==="hidden").length;

    return `
      <div class="court-admin-box">
        <div class="court-admin-head">
          <h3>⚖️ Sports Court Moderation</h3>
          <div class="court-count">${rows.length} total • ${approvedCount} public • ${hiddenCount} hidden</div>
        </div>
        <div class="court-admin-list">
          ${rows.length
            ? rows.map(renderCourtArgumentAdmin).join("")
            : `<div class="court-admin-empty">No Sports Court arguments have been submitted for this mistake.</div>`
          }
        </div>
      </div>
    `;
  }

  function renderCourtArgumentAdmin(argument){
    const status=argument.status||"approved";
    const side=argument.side==="defense"?"defense":"prosecution";
    const date=argument.created_at?new Date(argument.created_at).toLocaleString():"Unknown date";

    return `
      <div class="court-argument-admin ${status==="hidden"?"hidden-argument":""}" id="court-argument-${argument.id}">
        <div class="court-argument-top">
          <div>
            <span class="court-side-pill ${side}">${side}</span>
            <span class="court-status-pill ${escapeAttribute(status)}">${escapeHtml(status)}</span>
          </div>
          <div class="court-argument-meta">
            👍 ${Number(argument.upvotes||0)} upvotes
            ${courtReportCounts[argument.id] ? ` • 🚩 ${courtReportCounts[argument.id]} report${courtReportCounts[argument.id]===1?"":"s"}` : ""}
          </div>
        </div>

        <div class="court-argument-meta">
          Submitted by: ${escapeHtml(argument.author_name||"Anonymous fan")}<br>
          Created: ${escapeHtml(date)}
        </div>

        <div class="court-argument-text">${escapeHtml(argument.argument_text||"")}</div>

        <div class="court-actions">
          <button class="court-edit-btn" onclick="toggleCourtArgumentEdit('${argument.id}')">Edit</button>
          ${status!=="approved"
            ? `<button class="court-restore-btn" onclick="setCourtArgumentStatus('${argument.id}','approved')">Approve Publicly</button>`
            : `<button class="court-hide-btn" onclick="setCourtArgumentStatus('${argument.id}','hidden')">Hide from Public</button>`
          }
          ${status!=="rejected"
            ? `<button class="court-hide-btn" onclick="setCourtArgumentStatus('${argument.id}','rejected')">Reject</button>`
            : ""
          }
          <button class="court-delete-btn" onclick="deleteCourtArgument('${argument.id}')">Delete Permanently</button>
        </div>

        <div class="court-edit-area" id="court-edit-${argument.id}">
          <label>Argument</label>
          <textarea id="court-text-${argument.id}">${escapeHtml(argument.argument_text||"")}</textarea>

          <label>Name or nickname</label>
          <input id="court-name-${argument.id}" value="${escapeAttribute(argument.author_name||"Anonymous fan")}" />

          <button class="court-save-btn" onclick="saveCourtArgument('${argument.id}')">Save Argument</button>
          <button class="court-cancel-btn" onclick="toggleCourtArgumentEdit('${argument.id}')">Cancel</button>
        </div>
      </div>
    `;
  }

  function toggleCourtArgumentEdit(argumentId){
    const box=document.getElementById("court-edit-"+argumentId);
    if(!box)return;
    box.style.display=box.style.display==="block"?"none":"block";
  }

  async function runCourtAdminAction(payload){
    const {data:sessionData}=await client.auth.getSession();
    const accessToken=sessionData?.session?.access_token;

    if(!accessToken){
      alert("Your admin session has expired. Please log in again.");
      window.location.href="admin-login.html";
      return null;
    }

    try{
      const response=await fetch(`${SUPABASE_URL}/functions/v1/manage-court-argument`,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":`Bearer ${accessToken}`
        },
        body:JSON.stringify(payload)
      });

      const raw=await response.text();
      let result={};

      try{
        result=raw?JSON.parse(raw):{};
      }catch{
        result={success:false,error:"The moderation service returned an invalid response."};
      }

      if(!response.ok||!result.success){
        console.error("Sports Court admin action failed:",result);
        alert(result.error||"The Sports Court moderation action failed.");
        return null;
      }

      return result;
    }catch(error){
      console.error(error);
      alert("The Sports Court moderation service could not be reached.");
      return null;
    }
  }

  async function saveCourtArgument(argumentId){
    const argument=courtArguments.find(a=>a.id===argumentId);
    if(!argument)return alert("Argument not found.");

    const argumentText=document.getElementById("court-text-"+argumentId).value.trim();
    const authorName=document.getElementById("court-name-"+argumentId).value.trim()||"Anonymous fan";

    if(argumentText.length<20)return alert("The argument must contain at least 20 characters.");
    if(argumentText.length>800)return alert("The argument must remain under 800 characters.");
    if(authorName.length>60)return alert("The name or nickname must remain under 60 characters.");
    if(!confirm("Save these changes to the Sports Court argument?"))return;

    const result=await runCourtAdminAction({
      action:"edit",
      argument_id:argumentId,
      argument_text:argumentText,
      author_name:authorName
    });

    if(!result)return;

    argument.argument_text=argumentText;
    argument.author_name=authorName;
    rebuildCourtArgumentMap();
    renderMistakes();
    alert("Sports Court argument updated.");
  }

  async function setCourtArgumentStatus(argumentId,newStatus){
    const argument=courtArguments.find(a=>a.id===argumentId);
    if(!argument)return alert("Argument not found.");

    const promptText=
      newStatus==="hidden" ? "Hide this argument from the public Sports Court?" :
      newStatus==="rejected" ? "Reject this argument and keep it off the public Sports Court?" :
      "Approve this argument for the public Sports Court?";
    if(!confirm(promptText))return;

    const result=await runCourtAdminAction({
      action:"set_status",
      argument_id:argumentId,
      status:newStatus
    });

    if(!result)return;

    argument.status=newStatus;
    rebuildCourtArgumentMap();
    renderMistakes();
    alert(
      newStatus==="hidden" ? "Argument hidden from the public site." :
      newStatus==="rejected" ? "Argument rejected and kept off the public site." :
      "Argument approved and now public."
    );
  }

  async function deleteCourtArgument(argumentId){
    const argument=courtArguments.find(a=>a.id===argumentId);
    if(!argument)return alert("Argument not found.");

    if(!confirm("Permanently delete this Sports Court argument?\n\n"+(argument.argument_text||"")+"\n\nThis cannot be undone."))return;

    const result=await runCourtAdminAction({
      action:"delete",
      argument_id:argumentId
    });

    if(!result)return;

    courtArguments=courtArguments.filter(a=>a.id!==argumentId);
    rebuildCourtArgumentMap();
    renderMistakes();
    alert("Sports Court argument permanently deleted.");
  }

  function toggleEdit(id){const form=document.getElementById("edit-"+id);if(!form)return;form.style.display=form.style.display==="block"?"none":"block";}

  async function saveMistake(id){
    const updated={
      title:document.getElementById("title-"+id).value.trim(),
      sport:document.getElementById("sport-"+id).value.trim(),
      year:Number(document.getElementById("year-"+id).value)||null,
      category:document.getElementById("category-"+id).value.trim(),
      subcategory:document.getElementById("subcategory-"+id).value.trim(),
      teams_people:document.getElementById("teams-"+id).value.trim(),
      artwork_url:document.getElementById("artwork-"+id).value.trim() || null,
      summary:document.getElementById("summary-"+id).value.trim(),
      why_it_matters:document.getElementById("why-"+id).value.trim(),
      controversy_score:Number(document.getElementById("score-"+id).value)||0,
      source_1:document.getElementById("source1-"+id).value.trim(),
      source_2:document.getElementById("source2-"+id).value.trim()
    };
    if(!confirm("Save changes to this mistake?"))return;
    const {error}=await client.from("mistakes").update(updated).eq("id",id);
    if(error){console.error(error);alert("Save failed. Run the admin mistakes SQL policies if needed.");return}
    alert("Mistake updated.");await loadMistakes();
  }


  function getArtworkAdminSecret(){
    let secret=sessionStorage.getItem("sportsmistakes_artwork_admin_secret")||"";
    if(!secret){
      secret=prompt("Enter your ARTWORK_ADMIN_SECRET to generate artwork:")||"";
      if(secret)sessionStorage.setItem("sportsmistakes_artwork_admin_secret",secret);
    }
    return secret;
  }

  async function regenerateArtwork(id,title){
    const secret=getArtworkAdminSecret();
    if(!secret)return alert("Artwork generation cancelled. Missing admin secret.");

    const action=document.getElementById("artwork-"+id)?.value.trim()?"replace the current artwork":"generate artwork";
    if(!confirm(`Use OpenAI to ${action} for:

${title}

The current artwork will remain in place unless generation succeeds. This costs money per image.`))return;

    const button=document.getElementById("art-btn-"+id);
    const status=document.getElementById("artwork-status-"+id);
    if(button){button.disabled=true;button.textContent="Generating...";}
    if(status)status.textContent="Generating new artwork. This may take a minute or two...";

    try{
      const {data:sessionData}=await client.auth.getSession();
      const accessToken=sessionData.session?.access_token||SUPABASE_ANON_KEY;

      const response=await fetch(`${SUPABASE_URL}/functions/v1/generate-artwork`,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":`Bearer ${accessToken}`,
          "x-admin-secret":secret
        },
        body:JSON.stringify({mistake_id:id})
      });

      let data={};
      try{data=await response.json();}catch(_){data={success:false,error:"The artwork function returned an unreadable response."};}

      if(response.status===401){
        sessionStorage.removeItem("sportsmistakes_artwork_admin_secret");
        if(status)status.textContent="Incorrect admin password. The saved password was cleared.";
        alert("Incorrect artwork admin password. It has been cleared. Click the button again to retry.");
        return;
      }

      if(!response.ok||!data.success){
        console.error("Artwork generation failed",data);
        const detail=data?.details?.error?.message||data?.details?.message||data?.error||`HTTP ${response.status}`;
        if(status)status.textContent="Artwork generation failed: "+detail;
        alert("Artwork generation failed:\n\n" + detail);
        return;
      }

      if(status)status.textContent="Artwork regenerated successfully.";
      alert("New artwork generated successfully.");
      await loadMistakes();
    }catch(err){
      console.error(err);
      const message=String(err?.message||err);
      if(status)status.textContent="Artwork generation failed: "+message;
      alert("Artwork generation failed:\n\n" + message);
    }finally{
      if(button){button.disabled=false;button.textContent="Regenerate Artwork";}
    }
  }

  async function deleteMistake(id,title){
    if(!confirm("Delete this mistake?\n\n"+title+"\n\nThis cannot be undone."))return;
    const {error}=await client.from("mistakes").delete().eq("id",id);
    if(error){console.error(error);alert("Delete failed. Run the admin mistakes SQL policies if needed.");return}
    alert("Mistake deleted.");mistakes=mistakes.filter(m=>m.id!==id);renderMistakes();
  }

  function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function escapeAttribute(value){return escapeHtml(value).replaceAll("\\n"," ")}
  function escapeJs(value){return String(value).replaceAll("\\","\\\\").replaceAll("'","\\'")}

  document.getElementById("searchInput").addEventListener("input",renderMistakes);
  document.getElementById("sportFilter").addEventListener("change",renderMistakes);
  document.getElementById("categoryFilter").addEventListener("change",renderMistakes);
 requireSportsMistakesAdmin(client).then(ok => {
  if (ok) loadMistakes();
});
</script>
