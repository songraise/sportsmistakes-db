  <style>
    :root{
      --bg:#050b14;
      --nav:#081321;
      --panel:#0b1a2b;
      --panel2:#0f2238;
      --line:#29425f;
      --blue:#1e90ff;
      --blue2:#74b9ff;
      --gold:#ffcc00;
      --goldDark:#9f6d00;
      --red:#ef4444;
      --white:#ffffff;
      --muted:#b7c7d9;
      --soft:#dbeafe;
      --ink:#111827;
      --paper:#f8fafc;
    }

    *{box-sizing:border-box}
<script src="sportsmistakes-analytics.js" defer></script>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at 22% 10%,rgba(30,144,255,.22),transparent 34%),
        radial-gradient(circle at 75% 4%,rgba(255,204,0,.12),transparent 28%),
        linear-gradient(180deg,#06101d 0%,#020712 100%);
      color:#fff;
    }

    .top-nav{
      height:58px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(8,19,33,.96);
      border-bottom:1px solid var(--line);
      padding:0 22px;
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:blur(8px);
    }

    .nav-brand{
      font-weight:900;
      font-size:21px;
      color:white;
      cursor:pointer;
      letter-spacing:-.3px;
    }

    .nav-brand span{color:var(--gold)}

    .nav-links{display:flex;gap:20px;align-items:center;flex-wrap:wrap}

    .nav-links a{
      color:var(--blue2);
      text-decoration:none;
      font-weight:800;
      font-size:14px;
    }

    .nav-links a:hover{color:var(--gold)}

    .container{
      max-width:1280px;
      margin:28px auto 70px;
      padding:0 22px;
    }

    .loading,.error{
      text-align:center;
      color:#c7d7ea;
      padding:60px;
    }

    .detail-shell{display:grid;gap:22px}

    .back-link{
      display:inline-block;
      color:var(--gold);
      text-decoration:none;
      font-weight:900;
      margin:4px 0 4px;
      cursor:pointer;
    }

    .museum-hero{
      display:grid;
      grid-template-columns:minmax(420px,1.12fr) minmax(360px,.88fr);
      gap:34px;
      align-items:center;
      padding:28px 0 10px;
    }

    .gallery-side{
      position:relative;
      min-height:520px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .spotlight{
      position:absolute;
      top:-20px;
      left:50%;
      transform:translateX(-50%);
      width:280px;
      height:180px;
      background:radial-gradient(ellipse at center,rgba(255,221,120,.18),rgba(255,221,120,.05) 40%,transparent 72%);
      filter:blur(4px);
      pointer-events:none;
    }

    .frame-wrap{
      width:100%;
      max-width:630px;
      position:relative;
    }

    .art-frame{
      background:
        linear-gradient(135deg,#7a4b00,#ffd66b 12%,#8a5b00 26%,#ffe191 48%,#6e4300 70%,#d89b22 100%);
      border-radius:8px;
      padding:18px;
      box-shadow:
        0 30px 60px rgba(0,0,0,.55),
        inset 0 0 0 2px rgba(255,255,255,.22),
        inset 0 0 0 9px rgba(83,48,0,.42);
    }

    .art-inner{
      background:#06101d;
      border:5px solid rgba(30,20,8,.8);
      min-height:430px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#c7d7ea;
      font-weight:900;
      text-align:center;
      padding:24px;
      overflow:hidden;
    }

    /* Main artwork uses a real image element, not a CSS background.
       This prevents portrait-mode repetition on mobile devices. */
    .art-inner.has-art{
      min-height:0;
      padding:0;
      display:block;
      line-height:0;
    }

    .main-artwork{
      display:block;
      width:100%;
      height:auto;
      max-width:100%;
      object-fit:contain;
      object-position:center;
    }

    .plaque{
      width:46%;
      min-width:250px;
      margin:10px auto 0;
      padding:9px 12px;
      background:linear-gradient(180deg,#c7952d,#8c5b0a);
      border:1px solid #f3d27a;
      color:#160d00;
      text-align:center;
      font-weight:900;
      font-size:12px;
      letter-spacing:.5px;
      border-radius:2px;
      box-shadow:0 8px 20px rgba(0,0,0,.28);
    }

    .museum-ropes{
      position:absolute;
      bottom:0;
      left:4%;
      right:4%;
      height:74px;
      border-bottom:8px solid rgba(130,17,22,.88);
      border-radius:0 0 50% 50%;
      opacity:.9;
      pointer-events:none;
    }

    .museum-ropes::before,
    .museum-ropes::after{
      content:"";
      position:absolute;
      bottom:-18px;
      width:17px;
      height:74px;
      border-radius:999px;
      background:linear-gradient(180deg,#f5cc5a,#6b3f00);
      box-shadow:0 0 12px rgba(0,0,0,.45);
    }

    .museum-ropes::before{left:2%}
    .museum-ropes::after{right:2%}

    .hero-info{
      padding:18px 0;
    }

    .hero-kicker{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:18px;
      color:#dbeafe;
      font-weight:800;
    }

    .badge{
      display:inline-block;
      font-size:13px;
      padding:8px 12px;
      border-radius:999px;
      background:var(--blue);
      color:#fff;
      font-weight:900;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }

    .meta-dot{opacity:.45}

    .score-box{
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--gold);
      color:#111;
      padding:13px 17px;
      border-radius:10px;
      font-weight:900;
      box-shadow:0 12px 26px rgba(0,0,0,.35);
      margin-bottom:18px;
    }

    .score-box .score-number{font-size:27px;line-height:1}
    .score-box .score-label{font-size:11px;margin-top:5px;letter-spacing:.4px}

    .hero-title{
      margin:0 0 12px;
      color:#fff;
      font-size:54px;
      line-height:1;
      letter-spacing:-1.8px;
      text-shadow:0 8px 28px rgba(0,0,0,.65);
    }

    .hero-subtitle{
      color:#d8e4f2;
      font-size:20px;
      line-height:1.45;
      max-width:600px;
      margin:0 0 18px;
      font-weight:700;
    }

    .hero-views{
      color:var(--gold);
      font-weight:900;
      margin-bottom:24px;
    }

    .vote-box{
      background:rgba(10,25,42,.75);
      border:1px solid rgba(116,185,255,.28);
      border-radius:14px;
      padding:18px;
      max-width:600px;
      box-shadow:0 12px 28px rgba(0,0,0,.25);
    }

    .vote-head{
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:center;
      flex-wrap:wrap;
    }

    .vote-head h2{
      margin:0;
      color:#fff;
      font-size:22px;
    }

    .vote-head p{
      margin:6px 0 0;
      color:#d8e4f2;
      font-size:15px;
    }

    .vote-buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .vote-buttons button{
      padding:12px 15px;
      border:none;
      border-radius:9px;
      color:#fff;
      font-weight:900;
      cursor:pointer;
      font-size:14px;
    }

    .yes-btn{background:var(--blue)}
    .no-btn{background:#444}

    #voteResults{
      margin-top:14px;
      color:#fff;
      font-size:16px;
      line-height:1.45;
    }

    .share-row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .share-label{color:#d8e4f2;font-weight:800;margin-right:4px}

    .share-buttons{display:flex;flex-wrap:wrap;gap:10px}

    .share-buttons button,
    .share-buttons a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:42px;
      height:42px;
      border:none;
      border-radius:999px;
      color:#fff;
      text-decoration:none;
      font-weight:900;
      cursor:pointer;
      font-size:14px;
    }

    .share-x{background:#111}
    .share-facebook{background:#1877f2}
    .share-reddit{background:#ff4500}
    .share-copy{background:#555}
    .share-message{margin-top:10px;color:var(--gold);font-size:14px;font-weight:900}

    .content-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(390px,.95fr);
      border:1px solid var(--line);
      background:rgba(8,19,33,.75);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 18px 42px rgba(0,0,0,.35);
    }

    .story-panel,.court-panel{
      padding:28px;
      background:linear-gradient(180deg,rgba(13,27,46,.96),rgba(6,16,29,.94));
    }

    .story-panel{border-right:1px solid var(--line)}

    .story-section{
      padding-bottom:24px;
      margin-bottom:24px;
      border-bottom:1px solid rgba(216,224,234,.16);
    }

    .story-section:last-child{
      border-bottom:none;
      padding-bottom:0;
      margin-bottom:0;
    }

    .story-section h2,.court-panel h2,.sources-card h2,.related-card-wrap h2{
      color:var(--gold);
      margin:0 0 14px;
      font-size:22px;
      letter-spacing:.2px;
      text-transform:uppercase;
    }

    .story-section p,.court-intro{
      color:#edf5ff;
      line-height:1.7;
      font-size:17px;
      margin:0;
    }

    .team-pill{
      display:inline-block;
      background:rgba(30,144,255,.12);
      border:1px solid rgba(116,185,255,.32);
      color:#dbeafe;
      padding:12px 14px;
      border-radius:12px;
      font-weight:900;
      line-height:1.35;
    }

    .court-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:18px;
    }

    .court-side{
      background:rgba(3,10,20,.55);
      border:1px solid rgba(116,185,255,.26);
      border-radius:12px;
      padding:16px;
    }

    .court-side.prosecution{border-color:rgba(239,68,68,.45)}
    .court-side.defense{border-color:rgba(30,144,255,.45)}

    .court-side h3{
      margin:0 0 12px;
      font-size:17px;
      color:#fff;
    }

    .court-side.prosecution h3{color:#ff6464}
    .court-side.defense h3{color:#4da3ff}

    .argument{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.11);
      border-radius:10px;
      padding:12px;
      margin-bottom:10px;
    }

    .argument-text{
      color:#edf5ff;
      line-height:1.48;
      font-size:14px;
    }

    .argument-meta{
      margin-top:8px;
      color:#b7c7d9;
      font-size:12px;
    }

    .upvote-btn{
      margin-top:10px;
      background:#203852;
      color:#fff;
      border:none;
      border-radius:8px;
      padding:8px 10px;
      font-weight:900;
      cursor:pointer;
    }

    .upvote-btn:hover{background:var(--blue)}
    .argument-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
    .report-argument-btn{background:transparent;color:#b7c7d9;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer}
    .report-argument-btn:hover{color:#fff;border-color:var(--red)}

    .court-note{
      color:#b7c7d9;
      font-size:14px;
      line-height:1.45;
    }

    .court-form{
      margin-top:18px;
      background:rgba(247,249,252,.08);
      border:1px solid rgba(216,224,234,.18);
      border-radius:13px;
      padding:16px;
    }

    .court-form h3{margin:0;color:#fff}
    .court-form label{display:block;margin-top:12px;color:#d8e4f2;font-weight:900}

    .court-form select,.court-form textarea,.court-form input{
      width:100%;
      box-sizing:border-box;
      margin-top:8px;
      padding:12px;
      border-radius:8px;
      border:1px solid rgba(216,224,234,.28);
      background:#07111f;
      color:#fff;
      font-size:15px;
    }

    .court-form textarea{min-height:95px;resize:vertical}

    .court-form button{
      margin-top:14px;
      background:var(--blue);
      color:#fff;
      border:none;
      border-radius:8px;
      padding:12px 16px;
      font-weight:900;
      cursor:pointer;
    }

    .court-form button:disabled{
      opacity:.68;
      cursor:wait;
    }

    .court-message{
      margin-top:12px;
      color:var(--gold);
      font-size:14px;
      white-space:pre-wrap;
      font-weight:900;
    }

    .sources-card,.related-card-wrap{
      background:rgba(8,19,33,.86);
      border:1px solid var(--line);
      border-radius:16px;
      padding:24px 28px;
      box-shadow:0 14px 34px rgba(0,0,0,.26);
    }

    .sources a{
      display:inline-block;
      color:var(--blue2);
      text-decoration:none;
      margin-right:16px;
      margin-top:8px;
      font-weight:900;
    }

    .report-btn{
      background:#6b5b1e;
      color:white;
      border:none;
      border-radius:8px;
      padding:11px 14px;
      font-weight:900;
      cursor:pointer;
      margin-top:16px;
    }

    .report-box{
      display:none;
      margin-top:14px;
      background:rgba(247,249,252,.08);
      border:1px solid rgba(216,224,234,.18);
      border-radius:12px;
      padding:16px;
    }

    .report-box label{display:block;margin-top:12px;color:#d8e4f2;font-weight:900}

    .report-box select,.report-box textarea{
      width:100%;
      box-sizing:border-box;
      margin-top:8px;
      padding:11px;
      border-radius:8px;
      border:1px solid rgba(216,224,234,.28);
      background:#07111f;
      color:#fff;
      font-size:15px;
    }

    .report-box textarea{min-height:90px;resize:vertical}

    .report-submit{
      background:var(--blue);
      color:white;
      border:none;
      border-radius:8px;
      padding:11px 14px;
      font-weight:900;
      cursor:pointer;
      margin-top:12px;
    }

    .report-message{
      margin-top:10px;
      color:var(--gold);
      white-space:pre-wrap;
      font-weight:900;
    }

    .related-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:16px;
      margin-top:14px;
    }

    .related-card{
      background:rgba(13,22,32,.96);
      border:1px solid rgba(255,255,255,.14);
      border-radius:10px;
      overflow:hidden;
      cursor:pointer;
      color:#fff;
      box-shadow:0 8px 22px rgba(0,0,0,.25);
      transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
    }

    .related-card:hover{
      transform:translateY(-2px);
      border-color:rgba(226,36,36,.68);
      box-shadow:0 14px 30px rgba(0,0,0,.34);
    }

    .related-art{
      height:150px;
      background:
        radial-gradient(circle at 50% 30%,rgba(226,36,36,.45),transparent 35%),
        linear-gradient(135deg,#1f2937,#070b10);
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:900;
      text-align:center;
      padding:12px;
      font-size:30px;
    }

    .related-art.has-image{
      padding:0;
      overflow:hidden;
      background:#070b10;
    }

    .related-art img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
    }

    .related-body{padding:15px}

    .related-topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .related-badge{
      display:inline-block;
      font-size:11px;
      padding:4px 7px;
      border-radius:999px;
      background:rgba(226,36,36,.16);
      color:#ff6464;
      font-weight:900;
      text-transform:uppercase;
    }

    .related-score{
      display:inline-block;
      background:rgba(226,36,36,.18);
      color:#ff5555;
      padding:4px 7px;
      border-radius:7px;
      font-weight:900;
      font-size:12px;
      white-space:nowrap;
    }

    .related-card h3{
      font-size:20px;
      margin:6px 0 8px;
      line-height:1.15;
      color:#fff;
    }

    .related-meta{
      font-size:13px;
      color:#aab4c2;
      line-height:1.35;
      margin-bottom:10px;
    }

    .related-stats{
      display:flex;
      align-items:center;
      gap:12px;
      color:#ff5555;
      font-size:13px;
      font-weight:900;
      margin-top:10px;
    }

    .related-read{
      margin-top:12px;
      color:#fff;
      font-size:13px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.35px;
    }

    @media(max-width:1050px){
      .museum-hero{grid-template-columns:1fr;gap:20px}
      .gallery-side{min-height:auto}
      .hero-info{padding:0}
      .hero-title{font-size:42px}
      .content-grid{grid-template-columns:1fr}
      .story-panel{border-right:none;border-bottom:1px solid var(--line)}
    }

    @media(max-width:760px){
      .top-nav{height:auto;align-items:flex-start;flex-direction:column;gap:10px;padding:14px}
      .nav-links{gap:12px}.nav-links a{font-size:14px}
      .container{margin:20px auto 50px;padding:0 14px}
      .art-frame{padding:12px}
      .art-inner:not(.has-art){min-height:330px}
      .plaque{width:70%;min-width:220px}
      .museum-ropes{display:none}
      .hero-title{font-size:34px}
      .hero-subtitle{font-size:18px}
      .court-grid{grid-template-columns:1fr}
      .story-panel,.court-panel,.sources-card,.related-card-wrap{padding:20px}
    }


    /* SportsMistakes public design alignment — homepage visual system */
    :root{--bg:#05080c;--nav:#05080c;--panel:#0b1118;--panel2:#0e1620;--line:#243140;--blue:#e22424;--blue2:#ff6464;--gold:#e22424;--goldDark:#b91313;--red:#e22424;--white:#fff;--muted:#a8b3c1;--soft:#d7dee8;--ink:#f8fafc;--paper:#0b1118}
    body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(226,36,36,.18),transparent 30%),linear-gradient(180deg,#05080c 0%,#091017 45%,#05080c 100%);color:#f8fafc}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.55)),radial-gradient(circle at 30% 10%,rgba(255,255,255,.04),transparent 30%);z-index:-1}
    .top-nav{height:auto;min-height:88px;padding:18px 26px;background:rgba(5,8,12,.96);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);z-index:20}
    .brand-wrap{display:flex;align-items:center;gap:22px;cursor:pointer}
    .nav-brand{font-weight:1000;font-size:30px;line-height:.82;letter-spacing:-1px;text-transform:uppercase;color:#fff}
    .nav-brand span{color:var(--red)}
    .brand-tag{color:#e5e7eb;font-size:15px;line-height:1.35;border-left:1px solid rgba(255,255,255,.18);padding-left:22px}
    .nav-links{gap:28px}.nav-links a{color:#f4f4f5;font-weight:900;font-size:14px;letter-spacing:.8px;text-transform:uppercase}.nav-links a:hover{color:var(--red)}

function setMetaContent(selector,value){
  const element=document.querySelector(selector);
  if(element) element.setAttribute("content",value);
}

function updatePageSeo(mistake){
  const canonicalUrl=`https://sportsmistakes.com/mistake.html?id=${encodeURIComponent(mistake.id)}`;
  const title=`${mistake.title||"Sports Mistake"} | SportsMistakes`;
  const description=(mistake.summary||`Explore ${mistake.title||"this sports mistake"} and decide whether it was truly a mistake.`)
    .replace(/\s+/g," ")
    .trim()
    .slice(0,160);

  document.title=title;

  const canonical=document.getElementById("canonicalLink");
  if(canonical) canonical.setAttribute("href",canonicalUrl);

  const descriptionTag=document.querySelector('meta[name="description"]');
  if(descriptionTag) descriptionTag.setAttribute("content",description);

  setMetaContent('#ogTitle',title);
  setMetaContent('#ogDescription',description);
  setMetaContent('#ogUrl',canonicalUrl);
  setMetaContent('#twitterTitle',title);
  setMetaContent('#twitterDescription',description);

  const existingSchema=document.getElementById("mistakeStructuredData");
  if(existingSchema) existingSchema.remove();

  const schema=document.createElement("script");
  schema.id="mistakeStructuredData";
  schema.type="application/ld+json";
  schema.textContent=JSON.stringify({
    "@context":"https://schema.org",
    "@type":"Article",
    "headline":mistake.title||"Sports Mistake",
    "description":description,
    "mainEntityOfPage":canonicalUrl,
    "url":canonicalUrl,
    "publisher":{
      "@type":"Organization",
      "name":"SportsMistakes",
      "url":"https://sportsmistakes.com/"
    },
    ...(mistake.year?{"datePublished":`${mistake.year}-01-01`}:{})
  });
  document.head.appendChild(schema);
}

          <span>${escapeHtml(data.year||"")}</span>
          ${data.category?`<span class="meta-dot">|</span><span>${escapeHtml(data.category)}</span>`:""}

            <div>
              <h2>Fan Verdict</h2>

        <div class="share-row">
          <span class="share-label">Share this mistake:</span>
          <div class="share-buttons">
            <a class="share-x" href="${xUrl}" target="_blank">X</a>

        ${data.teams_people?`<div class="story-section"><h2>Teams / People</h2><p><span class="team-pill">${escapeHtml(data.teams_people)}</span></p></div>`:""}
        <div class="story-section"><h2>The Story</h2><p>${escapeHtml(data.summary||"No summary added yet.")}</p></div>
        ${data.why_it_matters?`<div class="story-section"><h2>Why This Changed Sports</h2><p>${escapeHtml(data.why_it_matters)}</p></div>`:""}
      </div>

      <div class="court-panel">

    <section class="sources-card sources">

    .from("mistakes")
    .update({views:newViewCount})

function getShortDeck(m){
  if(m.why_it_matters) return String(m.why_it_matters).split(".")[0].slice(0,150)+".";
  if(m.summary) return String(m.summary).split(".")[0].slice(0,150)+".";
  return "A debated moment from sports history.";
}

function getShareUrl(){return window.location.origin+window.location.pathname+"?id="+encodeURIComponent(id)}

function getShareText(m){return `Was "${m.title||"this sports mistake"}" actually a sports mistake? Vote on SportsMistakes. Controversy score: ${m.controversy_score||0}/100.`}

async function copyShareLink(){
  const msg=document.getElementById("shareMessage"),text=`${getShareText(currentMistake)} ${getShareUrl()}`;
  try{await navigator.clipboard.writeText(text);msg.innerText="Share link copied."}
  catch(err){console.error(err);msg.innerText="Copy failed. You can copy the URL from your browser."}
}

async function loadVotes(){
  const box=document.getElementById("voteResults");
  if(!box||!id)return;
  const{data,error}=await client.from("mistake_votes").select("vote").eq("mistake_id",id);
  if(error){box.innerText="Could not load votes.";console.error(error);return}
  const votes=data||[],total=votes.length,yes=votes.filter(v=>v.vote==="yes").length,no=votes.filter(v=>v.vote==="no").length;
  if(total===0){box.innerHTML="No votes yet. Be the first to vote.";return}
  const yesPercent=Math.round((yes/total)*100),noPercent=Math.round((no/total)*100);
  box.innerHTML=`<strong>${yesPercent}% YES</strong> / ${noPercent}% NO<br>${total} total vote${total===1?"":"s"}`;
}

async function submitVote(vote){
  const voteKey="sportsmistakes_vote_"+id;
  if(localStorage.getItem(voteKey)){alert("You already voted on this mistake.");return}
  let voterId=localStorage.getItem("sportsmistakes_voter_id");
  if(!voterId){voterId=crypto.randomUUID();localStorage.setItem("sportsmistakes_voter_id",voterId)}
  const{error}=await client.from("mistake_votes").insert({mistake_id:id,vote:vote,voter_id:voterId});
  if(error){alert("Vote failed. Please try again.");console.error(error);return}
  localStorage.setItem(voteKey,vote);
  await loadVotes();
}


async function loadCourtArguments(){
  const p=document.getElementById("prosecutionArguments"),d=document.getElementById("defenseArguments");
  if(!p||!d||!id)return;
  const{data,error}=await client.from("sports_court_arguments").select("*").eq("mistake_id",id).eq("status","approved").order("upvotes",{ascending:false}).order("created_at",{ascending:false});
  if(error){console.error(error);p.innerHTML="Could not load arguments. Did you run the Sports Court SQL?";d.innerHTML="Could not load arguments.";return}
  const list=data||[];
  p.innerHTML=renderArguments(list.filter(a=>a.side==="prosecution"),"prosecution");
  d.innerHTML=renderArguments(list.filter(a=>a.side==="defense"),"defense");
}

function renderArguments(list,side){
  if(!list||list.length===0)return`<div class="court-note">No ${side} arguments yet. Be the first to make the case.</div>`;

  return list.map(arg=>`
    <div class="argument">
      <div class="argument-text">${escapeHtml(arg.argument_text||"")}</div>
      <div class="argument-meta">
        ${escapeHtml(arg.author_name||"Anonymous fan")}
        ${arg.created_at?" • "+new Date(arg.created_at).toLocaleDateString():""}
      </div>
      <div class="argument-actions">
        <button class="upvote-btn" onclick="upvoteArgument('${arg.id}')">👍 ${arg.upvotes||0}</button>
        <button class="report-argument-btn" onclick="reportCourtArgument('${arg.id}')">🚩 Report</button>
      </div>
    </div>
  `).join("");
}

async function submitCourtArgument(){
  const msg=document.getElementById("courtMessage");
  const side=document.getElementById("courtSide").value;
  const text=document.getElementById("courtArgument").value.trim();
  const name=document.getElementById("courtName").value.trim()||"Anonymous fan";
  const button=document.querySelector('.court-form button[onclick="submitCourtArgument()"]');

  if(!text||text.length<20){
    msg.innerText="Please write a constructive argument of at least 20 characters.";
    return;
  }

  if(text.length>800){
    msg.innerText="Please keep the argument under 800 characters.";
    return;
  }

  if(name.length>60){
    msg.innerText="Please keep the name or nickname under 60 characters.";
    return;
  }

  const originalButtonText=button?button.innerText:"Submit Argument";

  if(button){
    button.disabled=true;
    button.innerText="Checking Safety...";
  }

  msg.innerText="Checking argument for safety...";

  try{
    const response=await fetch(
      `${SUPABASE_URL}/functions/v1/submit-court-argument`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":`Bearer ${SUPABASE_ANON_KEY}`
        },
        body:JSON.stringify({
          mistake_id:id,
          side:side,
          argument_text:text,
          author_name:name
        })
      }
    );

    const raw=await response.text();
    let result={};

    try{
      result=raw?JSON.parse(raw):{};
    }catch{
      result={
        success:false,
        error:"The safety service returned an invalid response."
      };
    }

    if(!response.ok||!result.success){
      console.error("Sports Court moderation rejected or failed:",result);
      msg.innerText=
        result.message||
        result.error||
        "This argument could not be submitted.";
      return;
    }

    document.getElementById("courtArgument").value="";
    document.getElementById("courtName").value="";
    msg.innerText=result.message||"Argument submitted for moderator review.";
    await loadCourtArguments();

  }catch(error){
    console.error("Sports Court submission failed:",error);
    msg.innerText="The safety check could not be completed. Please try again.";

  }finally{
    if(button){
      button.disabled=false;
      button.innerText=originalButtonText;
    }
  }
}

async function upvoteArgument(argumentId){
  const localVoteKey="sports_court_upvote_"+argumentId;

  if(localStorage.getItem(localVoteKey)){
    alert("You already upvoted this argument.");
    return;
  }

  let voterId=localStorage.getItem("sportsmistakes_court_voter_id");

  if(!voterId){
    voterId=crypto.randomUUID();
    localStorage.setItem("sportsmistakes_court_voter_id",voterId);
  }

  try{
    const response=await fetch(
      `${SUPABASE_URL}/functions/v1/upvote-court-argument`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_ANON_KEY,
          "Authorization":`Bearer ${SUPABASE_ANON_KEY}`
        },
        body:JSON.stringify({
          argument_id:argumentId,
          voter_id:voterId
        })
      }
    );

    const raw=await response.text();
    let result={};

    try{
      result=raw?JSON.parse(raw):{};
    }catch{
      result={
        success:false,
        error:"The upvote service returned an invalid response."
      };
    }

    if(response.status===409||result.code==="already_upvoted"){
      localStorage.setItem(localVoteKey,"true");
      alert("You already upvoted this argument.");
      return;
    }

    if(!response.ok||!result.success){
      console.error("Sports Court upvote failed:",result);
      alert(
        result.message||
        result.error||
        "Could not upvote."
      );
      return;
    }

    localStorage.setItem(localVoteKey,"true");
    await loadCourtArguments();

  }catch(error){
    console.error("Sports Court upvote request failed:",error);
    alert("The upvote service could not be reached.");
  }
}

async function reportCourtArgument(argumentId){
  const reportKey="sports_court_report_"+argumentId;

  if(localStorage.getItem(reportKey)){
    alert("You already reported this argument.");
    return;
  }

  const reason=prompt(
    "Why are you reporting this argument?\n\nExamples: hate, racism, threat, harassment, sexual content, spam, or other unsafe content.",
    "Unsafe or offensive content"
  );

  if(reason===null)return;

  let reporterId=localStorage.getItem("sportsmistakes_reporter_id");
  if(!reporterId){
    reporterId=crypto.randomUUID();
    localStorage.setItem("sportsmistakes_reporter_id",reporterId);
  }

  try{
    const response=await fetch(`${SUPABASE_URL}/functions/v1/report-court-argument`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`
      },
      body:JSON.stringify({
        argument_id:argumentId,
        reporter_id:reporterId,
        reason:reason.trim()||"Unsafe or offensive content"
      })
    });

    const raw=await response.text();
    let result={};

    try{
      result=raw?JSON.parse(raw):{};
    }catch{
      result={success:false,error:"The reporting service returned an invalid response."};
    }

    if(!response.ok||!result.success){
      alert(result.error||"The report could not be submitted.");
      return;
    }

    localStorage.setItem(reportKey,"true");
    alert(result.message||"Report received. Thank you.");

    if(result.automatically_hidden){
      await loadCourtArguments();
    }
  }catch(error){
    console.error(error);
    alert("The reporting service could not be reached.");
  }
}

async function loadRelatedMistakes(){
  const box=document.getElementById("relatedMistakes");
  if(!box||!currentMistake)return;
  const{data,error}=await client
    .from("mistakes")
    .select("id,title,sport,year,category,subcategory,controversy_score,views,artwork_url")
    .neq("id",id)
    .or(`sport.eq.${currentMistake.sport},category.eq.${currentMistake.category},subcategory.eq.${currentMistake.subcategory}`)
    .order("controversy_score",{ascending:false})
    .limit(6);
  if(error){console.error(error);box.innerHTML="Could not load related mistakes.";return}
  if(!data||data.length===0){box.innerHTML="No related mistakes yet.";return}
  box.innerHTML=`<div class="related-grid">${data.map(m=>{
    const art=m.artwork_url||m.ai_artwork_url||"";
    const meta=[m.year,m.league||"",m.category||""].filter(Boolean).join(" • ");
    const relatedArt=art
      ? `<div class="related-art has-image"><img src="${escapeAttr(art)}" alt="${escapeAttr(m.title||"Related sports mistake artwork")}" loading="lazy" decoding="async"></div>`
      : `<div class="related-art">SportsMistakes</div>`;
    return `<div class="related-card" onclick="window.location.href='mistake.html?id=${m.id}'">
      ${relatedArt}
      <div class="related-body">
        <div class="related-topline">
          <span class="related-badge">${escapeHtml(m.sport||"Sport")}</span>
          <span class="related-score">${escapeHtml(m.controversy_score||0)}/100</span>
        </div>
        <h3>${escapeHtml(m.title||"Untitled Mistake")}</h3>
        <div class="related-meta">${escapeHtml(meta)}</div>
        <div class="related-stats"><span>👁 ${formatNumber(m.views||0)}</span><span>🔥 ${escapeHtml(m.controversy_score||0)}/100</span></div>
        <div class="related-read">Read Story →</div>
      </div>
    </div>`
  }).join("")}</div>`;
}

function toggleReportBox(){
  const box=document.getElementById("reportBox");if(!box)return;
  box.style.display=box.style.display==="block"?"none":"block";
}

async function submitIssueReport(){
  const reportMessage=document.getElementById("reportMessage");
  const reportType=document.getElementById("reportType").value;
  const reportDetails=document.getElementById("reportDetails").value.trim();
  if(!reportDetails){reportMessage.innerText="Please add a short explanation.";return}
  reportMessage.innerText="Submitting report...";
  const {error}=await client.from("mistake_reports").insert({mistake_id:id,report_type:reportType,details:reportDetails,status:"open"});
  if(error){console.error(error);reportMessage.innerText="Report failed. Please try again.";return}
  reportMessage.innerText="Report received. Thank you for helping improve SportsMistakes.";
  document.getElementById("reportDetails").value="";
}

function formatNumber(n){
  const num=Number(n||0);
  if(num>=1000000)return(num/1000000).toFixed(num>=10000000?0:1)+"M";
  if(num>=1000)return num.toLocaleString();
  return String(num);
}

function escapeHtml(value){return String(value||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(value){return String(value||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("'","&#039;").replaceAll("<","&lt;").replaceAll(">","&gt;")}

loadMistake();
</script>
