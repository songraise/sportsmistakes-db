
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SportsMistakes | Mistake Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#050b14;
      --nav:#081321;
      --panel:#0b1a2b;
      --panel2:#0f2238;
      --line:#29425f;
      --blue:#1e90ff;
      --blue2:#74b9ff;
      --gold:#ffcc00;
      --goldDark:#9f6d00;
      --red:#ef4444;
      --white:#ffffff;
      --muted:#b7c7d9;
      --soft:#dbeafe;
      --ink:#111827;
      --paper:#f8fafc;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at 22% 10%,rgba(30,144,255,.22),transparent 34%),
        radial-gradient(circle at 75% 4%,rgba(255,204,0,.12),transparent 28%),
        linear-gradient(180deg,#06101d 0%,#020712 100%);
      color:#fff;
    }

    .top-nav{
      height:58px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(8,19,33,.96);
      border-bottom:1px solid var(--line);
      padding:0 22px;
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:blur(8px);
    }

    .nav-brand{
      font-weight:900;
      font-size:21px;
      color:white;
      cursor:pointer;
      letter-spacing:-.3px;
    }

    .nav-brand span{color:var(--gold)}

    .nav-links{display:flex;gap:20px;align-items:center;flex-wrap:wrap}

    .nav-links a{
      color:var(--blue2);
      text-decoration:none;
      font-weight:800;
      font-size:14px;
    }

    .nav-links a:hover{color:var(--gold)}

    .container{
      max-width:1280px;
      margin:28px auto 70px;
      padding:0 22px;
    }

    .loading,.error{
      text-align:center;
      color:#c7d7ea;
      padding:60px;
    }

    .detail-shell{display:grid;gap:22px}

    .back-link{
      display:inline-block;
      color:var(--gold);
      text-decoration:none;
      font-weight:900;
      margin:4px 0 4px;
      cursor:pointer;
    }

    .museum-hero{
      display:grid;
      grid-template-columns:minmax(420px,1.12fr) minmax(360px,.88fr);
      gap:34px;
      align-items:center;
      padding:28px 0 10px;
    }

    .gallery-side{
      position:relative;
      min-height:520px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .spotlight{
      position:absolute;
      top:-20px;
      left:50%;
      transform:translateX(-50%);
      width:280px;
      height:180px;
      background:radial-gradient(ellipse at center,rgba(255,221,120,.18),rgba(255,221,120,.05) 40%,transparent 72%);
      filter:blur(4px);
      pointer-events:none;
    }

    .frame-wrap{
      width:100%;
      max-width:630px;
      position:relative;
    }

    .art-frame{
      background:
        linear-gradient(135deg,#7a4b00,#ffd66b 12%,#8a5b00 26%,#ffe191 48%,#6e4300 70%,#d89b22 100%);
      border-radius:8px;
      padding:18px;
      box-shadow:
        0 30px 60px rgba(0,0,0,.55),
        inset 0 0 0 2px rgba(255,255,255,.22),
        inset 0 0 0 9px rgba(83,48,0,.42);
    }

    .art-inner{
      background:#06101d;
      border:5px solid rgba(30,20,8,.8);
      min-height:430px;
      background-size:contain;
      background-repeat:no-repeat;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#c7d7ea;
      font-weight:900;
      text-align:center;
      padding:24px;
    }

    .plaque{
      width:46%;
      min-width:250px;
      margin:10px auto 0;
      padding:9px 12px;
      background:linear-gradient(180deg,#c7952d,#8c5b0a);
      border:1px solid #f3d27a;
      color:#160d00;
      text-align:center;
      font-weight:900;
      font-size:12px;
      letter-spacing:.5px;
      border-radius:2px;
      box-shadow:0 8px 20px rgba(0,0,0,.28);
    }

    .museum-ropes{
      position:absolute;
      bottom:0;
      left:4%;
      right:4%;
      height:74px;
      border-bottom:8px solid rgba(130,17,22,.88);
      border-radius:0 0 50% 50%;
      opacity:.9;
      pointer-events:none;
    }

    .museum-ropes::before,
    .museum-ropes::after{
      content:"";
      position:absolute;
      bottom:-18px;
      width:17px;
      height:74px;
      border-radius:999px;
      background:linear-gradient(180deg,#f5cc5a,#6b3f00);
      box-shadow:0 0 12px rgba(0,0,0,.45);
    }

    .museum-ropes::before{left:2%}
    .museum-ropes::after{right:2%}

    .hero-info{
      padding:18px 0;
    }

    .hero-kicker{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:18px;
      color:#dbeafe;
      font-weight:800;
    }

    .badge{
      display:inline-block;
      font-size:13px;
      padding:8px 12px;
      border-radius:999px;
      background:var(--blue);
      color:#fff;
      font-weight:900;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
    }

    .meta-dot{opacity:.45}

    .score-box{
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--gold);
      color:#111;
      padding:13px 17px;
      border-radius:10px;
      font-weight:900;
      box-shadow:0 12px 26px rgba(0,0,0,.35);
      margin-bottom:18px;
    }

    .score-box .score-number{font-size:27px;line-height:1}
    .score-box .score-label{font-size:11px;margin-top:5px;letter-spacing:.4px}

    .hero-title{
      margin:0 0 12px;
      color:#fff;
      font-size:54px;
      line-height:1;
      letter-spacing:-1.8px;
      text-shadow:0 8px 28px rgba(0,0,0,.65);
    }

    .hero-subtitle{
      color:#d8e4f2;
      font-size:20px;
      line-height:1.45;
      max-width:600px;
      margin:0 0 18px;
      font-weight:700;
    }

    .hero-views{
      color:var(--gold);
      font-weight:900;
      margin-bottom:24px;
    }

    .vote-box{
      background:rgba(10,25,42,.75);
      border:1px solid rgba(116,185,255,.28);
      border-radius:14px;
      padding:18px;
      max-width:600px;
      box-shadow:0 12px 28px rgba(0,0,0,.25);
    }

    .vote-head{
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:center;
      flex-wrap:wrap;
    }

    .vote-head h2{
      margin:0;
      color:#fff;
      font-size:22px;
    }

    .vote-head p{
      margin:6px 0 0;
      color:#d8e4f2;
      font-size:15px;
    }

    .vote-buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .vote-buttons button{
      padding:12px 15px;
      border:none;
      border-radius:9px;
      color:#fff;
      font-weight:900;
      cursor:pointer;
      font-size:14px;
    }

    .yes-btn{background:var(--blue)}
    .no-btn{background:#444}

    #voteResults{
      margin-top:14px;
      color:#fff;
      font-size:16px;
      line-height:1.45;
    }

    .share-row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .share-label{color:#d8e4f2;font-weight:800;margin-right:4px}

    .share-buttons{display:flex;flex-wrap:wrap;gap:10px}

    .share-buttons button,
    .share-buttons a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:42px;
      height:42px;
      border:none;
      border-radius:999px;
      color:#fff;
      text-decoration:none;
      font-weight:900;
      cursor:pointer;
      font-size:14px;
    }

    .share-x{background:#111}
    .share-facebook{background:#1877f2}
    .share-reddit{background:#ff4500}
    .share-copy{background:#555}
    .share-message{margin-top:10px;color:var(--gold);font-size:14px;font-weight:900}

    .content-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(390px,.95fr);
      border:1px solid var(--line);
      background:rgba(8,19,33,.75);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 18px 42px rgba(0,0,0,.35);
    }

    .story-panel,.court-panel{
      padding:28px;
      background:linear-gradient(180deg,rgba(13,27,46,.96),rgba(6,16,29,.94));
    }

    .story-panel{border-right:1px solid var(--line)}

    .story-section{
      padding-bottom:24px;
      margin-bottom:24px;
      border-bottom:1px solid rgba(216,224,234,.16);
    }

    .story-section:last-child{
      border-bottom:none;
      padding-bottom:0;
      margin-bottom:0;
    }

    .story-section h2,.court-panel h2,.sources-card h2,.related-card-wrap h2{
      color:var(--gold);
      margin:0 0 14px;
      font-size:22px;
      letter-spacing:.2px;
      text-transform:uppercase;
    }

    .story-section p,.court-intro{
      color:#edf5ff;
      line-height:1.7;
      font-size:17px;
      margin:0;
    }

    .team-pill{
      display:inline-block;
      background:rgba(30,144,255,.12);
      border:1px solid rgba(116,185,255,.32);
      color:#dbeafe;
      padding:12px 14px;
      border-radius:12px;
      font-weight:900;
      line-height:1.35;
    }

    .court-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:18px;
    }

    .court-side{
      background:rgba(3,10,20,.55);
      border:1px solid rgba(116,185,255,.26);
      border-radius:12px;
      padding:16px;
    }

    .court-side.prosecution{border-color:rgba(239,68,68,.45)}
    .court-side.defense{border-color:rgba(30,144,255,.45)}

    .court-side h3{
      margin:0 0 12px;
      font-size:17px;
      color:#fff;
    }

    .court-side.prosecution h3{color:#ff6464}
    .court-side.defense h3{color:#4da3ff}

    .argument{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.11);
      border-radius:10px;
      padding:12px;
      margin-bottom:10px;
    }

    .argument-text{
      color:#edf5ff;
      line-height:1.48;
      font-size:14px;
    }

    .argument-meta{
      margin-top:8px;
      color:#b7c7d9;
      font-size:12px;
    }

    .upvote-btn{
      margin-top:10px;
      background:#203852;
      color:#fff;
      border:none;
      border-radius:8px;
      padding:8px 10px;
      font-weight:900;
      cursor:pointer;
    }

    .upvote-btn:hover{background:var(--blue)}

    .argument-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
    .argument-report-btn{background:transparent;color:#d6dee8;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer}
    .argument-report-btn:hover{border-color:#ff6464;color:#ff8080}
    .argument-report-box{display:none;margin-top:10px;padding:12px;border:1px solid rgba(255,255,255,.14);border-radius:9px;background:rgba(5,10,16,.72)}
    .argument-report-box.open{display:block}
    .argument-report-box label{display:block;margin:8px 0 5px;color:#d8e4f2;font-size:12px;font-weight:900}
    .argument-report-box select,.argument-report-box textarea{width:100%;box-sizing:border-box;padding:9px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.18);background:#07111f;color:#fff;font-size:13px}
    .argument-report-box textarea{min-height:70px;resize:vertical}
    .argument-report-submit{margin-top:9px;background:#6b1f1f;color:#fff;border:none;border-radius:7px;padding:9px 11px;font-size:12px;font-weight:900;cursor:pointer}
    .argument-report-message{margin-top:8px;color:var(--gold);font-size:12px;font-weight:800}

    .court-note{
      color:#b7c7d9;
      font-size:14px;
      line-height:1.45;
    }

    .court-form{
      margin-top:18px;
      background:rgba(247,249,252,.08);
      border:1px solid rgba(216,224,234,.18);
      border-radius:13px;
      padding:16px;
    }

    .court-form h3{margin:0;color:#fff}
    .court-form label{display:block;margin-top:12px;color:#d8e4f2;font-weight:900}

    .court-form select,.court-form textarea,.court-form input{
      width:100%;
      box-sizing:border-box;
      margin-top:8px;
      padding:12px;
      border-radius:8px;
      border:1px solid rgba(216,224,234,.28);
      background:#07111f;
      color:#fff;
      font-size:15px;
    }

    .court-form textarea{min-height:95px;resize:vertical}

    .court-form button{
      margin-top:14px;
      background:var(--blue);
      color:#fff;
      border:none;
      border-radius:8px;
      padding:12px 16px;
      font-weight:900;
      cursor:pointer;
    }

    .court-message{
      margin-top:12px;
      color:var(--gold);
      font-size:14px;
      white-space:pre-wrap;
      font-weight:900;
    }


    .learning-card{
      background:linear-gradient(180deg,rgba(13,27,46,.96),rgba(6,16,29,.94));
      border:1px solid rgba(255,204,0,.28);
      border-radius:16px;
      padding:26px 28px;
      box-shadow:0 14px 34px rgba(0,0,0,.28);
    }

    .learning-card h2{
      margin:0 0 8px;
      color:var(--gold);
      font-size:24px;
      text-transform:uppercase;
    }

    .learning-intro{
      margin:0 0 18px;
      color:#edf5ff;
      line-height:1.55;
      font-size:16px;
    }

    .learning-grid{
      display:grid;
      grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
      gap:24px;
      align-items:start;
    }

    .lesson-picker{
      background:rgba(3,10,20,.5);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      padding:16px;
    }

    .lesson-picker-title{
      color:#fff;
      font-weight:900;
      margin-bottom:6px;
      font-size:17px;
    }

    .lesson-picker-note{
      color:#b7c7d9;
      font-size:13px;
      margin-bottom:14px;
    }

    .lesson-options{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }

    .lesson-option{
      display:flex;
      align-items:center;
      gap:9px;
      padding:10px 11px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:9px;
      background:rgba(255,255,255,.045);
      color:#edf5ff;
      cursor:pointer;
      font-size:14px;
      font-weight:800;
    }

    .lesson-option:hover{
      border-color:rgba(255,204,0,.42);
    }

    .lesson-option input{
      accent-color:#ffcc00;
      width:17px;
      height:17px;
      flex:0 0 auto;
    }

    .lesson-submit{
      margin-top:14px;
      background:var(--gold);
      color:#111;
      border:none;
      border-radius:8px;
      padding:11px 15px;
      font-weight:900;
      cursor:pointer;
    }

    .lesson-submit:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .lesson-message{
      margin-top:10px;
      color:var(--gold);
      font-size:13px;
      font-weight:900;
      min-height:18px;
    }

    .lesson-results{
      background:rgba(3,10,20,.5);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      padding:16px;
    }

    .lesson-results-title{
      color:#fff;
      font-size:17px;
      font-weight:900;
      margin-bottom:12px;
    }

    .lesson-result-row{
      margin-bottom:13px;
    }

    .lesson-result-row:last-child{
      margin-bottom:0;
    }

    .lesson-result-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:#edf5ff;
      font-size:13px;
      font-weight:900;
      margin-bottom:6px;
    }

    .lesson-bar-track{
      width:100%;
      height:11px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.08);
    }

    .lesson-bar-fill{
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#ffcc00,#f59e0b);
      min-width:2px;
    }

    .lesson-empty{
      color:#b7c7d9;
      font-size:14px;
      line-height:1.45;
    }

    .sources-card,.related-card-wrap{
      background:rgba(8,19,33,.86);
      border:1px solid var(--line);
      border-radius:16px;
      padding:24px 28px;
      box-shadow:0 14px 34px rgba(0,0,0,.26);
    }

    .sources a{
      display:inline-block;
      color:var(--blue2);
      text-decoration:none;
      margin-right:16px;
      margin-top:8px;
      font-weight:900;
    }

    .report-btn{
      background:#6b5b1e;
      color:white;
      border:none;
      border-radius:8px;
      padding:11px 14px;
      font-weight:900;
      cursor:pointer;
      margin-top:16px;
    }

    .report-box{
      display:none;
      margin-top:14px;
      background:rgba(247,249,252,.08);
      border:1px solid rgba(216,224,234,.18);
      border-radius:12px;
      padding:16px;
    }

    .report-box label{display:block;margin-top:12px;color:#d8e4f2;font-weight:900}

    .report-box select,.report-box textarea{
      width:100%;
      box-sizing:border-box;
      margin-top:8px;
      padding:11px;
      border-radius:8px;
      border:1px solid rgba(216,224,234,.28);
      background:#07111f;
      color:#fff;
      font-size:15px;
    }

    .report-box textarea{min-height:90px;resize:vertical}

    .report-submit{
      background:var(--blue);
      color:white;
      border:none;
      border-radius:8px;
      padding:11px 14px;
      font-weight:900;
      cursor:pointer;
      margin-top:12px;
    }

    .report-message{
      margin-top:10px;
      color:var(--gold);
      white-space:pre-wrap;
      font-weight:900;
    }

    .related-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:16px;
      margin-top:14px;
    }

    .related-card{
      background:rgba(13,22,32,.96);
      border:1px solid rgba(255,255,255,.14);
      border-radius:10px;
      overflow:hidden;
      cursor:pointer;
      color:#fff;
      box-shadow:0 8px 22px rgba(0,0,0,.25);
      transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
    }

    .related-card:hover{
      transform:translateY(-2px);
      border-color:rgba(226,36,36,.68);
      box-shadow:0 14px 30px rgba(0,0,0,.34);
    }

    .related-art{
      height:150px;
      background:
        radial-gradient(circle at 50% 30%,rgba(226,36,36,.45),transparent 35%),
        linear-gradient(135deg,#1f2937,#070b10);
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:900;
      text-align:center;
      padding:12px;
      font-size:30px;
    }

    .related-body{padding:15px}

    .related-topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .related-badge{
      display:inline-block;
      font-size:11px;
      padding:4px 7px;
      border-radius:999px;
      background:rgba(226,36,36,.16);
      color:#ff6464;
      font-weight:900;
      text-transform:uppercase;
    }

    .related-score{
      display:inline-block;
      background:rgba(226,36,36,.18);
      color:#ff5555;
      padding:4px 7px;
      border-radius:7px;
      font-weight:900;
      font-size:12px;
      white-space:nowrap;
    }

    .related-card h3{
      font-size:20px;
      margin:6px 0 8px;
      line-height:1.15;
      color:#fff;
    }

    .related-meta{
      font-size:13px;
      color:#aab4c2;
      line-height:1.35;
      margin-bottom:10px;
    }

    .related-stats{
      display:flex;
      align-items:center;
      gap:12px;
      color:#ff5555;
      font-size:13px;
      font-weight:900;
      margin-top:10px;
    }

    .related-read{
      margin-top:12px;
      color:#fff;
      font-size:13px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.35px;
    }



    .lesson-dropdown-toggle{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      background:#07111f;
      color:#fff;
      border:1px solid rgba(255,204,0,.32);
      border-radius:9px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
      text-align:left;
    }

    .lesson-dropdown-panel{
      display:none;
      margin-top:8px;

function getShortDeck(m){
  if(m.why_it_matters) return String(m.why_it_matters).split(".")[0].slice(0,150)+".";
  if(m.summary) return String(m.summary).split(".")[0].slice(0,150)+".";
  return "A debated moment from sports history.";
}

function getShareUrl(){return window.location.origin+window.location.pathname+"?id="+encodeURIComponent(id)}

function getShareText(m){return `Was "${m.title||"this sports mistake"}" actually a sports mistake? Vote on SportsMistakes. Controversy score: ${m.controversy_score||0}/100.`}

async function copyShareLink(){
  const msg=document.getElementById("shareMessage"),text=`${getShareText(currentMistake)} ${getShareUrl()}`;
  try{await navigator.clipboard.writeText(text);msg.innerText="Share link copied."}
  catch(err){console.error(err);msg.innerText="Copy failed. You can copy the URL from your browser."}
}

function updateDetailVoteButtons(){
  const savedVote=localStorage.getItem("sportsmistakes_vote_"+id);
  const buttons=document.querySelectorAll(".vote-buttons button");
  buttons.forEach(btn=>{
    btn.disabled=Boolean(savedVote);
    btn.style.opacity=savedVote?"0.55":"";
    btn.style.cursor=savedVote?"not-allowed":"";
  });
  if(savedVote==="yes"||savedVote==="no"){
    const selected=document.querySelector(savedVote==="yes"?".vote-buttons .yes-btn":".vote-buttons .no-btn");
    if(selected){selected.style.opacity="1";selected.textContent=(savedVote==="yes"?"✓ YES — Mistake":"✓ NO — Not a Mistake");}
  }
}

async function loadVotes(){
  const box=document.getElementById("voteResults");
  if(!box||!id)return;
  updateDetailVoteButtons();
  const{data,error}=await client.from("mistake_votes").select("vote").eq("mistake_id",id);
  if(error){box.innerText="Could not load votes.";console.error(error);return}
  const votes=data||[],total=votes.length,yes=votes.filter(v=>v.vote==="yes").length,no=votes.filter(v=>v.vote==="no").length;
  if(total===0){box.innerHTML="No votes yet. Be the first to vote.";return}
  const yesPercent=Math.round((yes/total)*100),noPercent=Math.round((no/total)*100);
  const locked=localStorage.getItem("sportsmistakes_vote_"+id)?"<br><span style=\"color:#a8b3c1;font-size:13px\">Your vote is locked for this mistake.</span>":"";
  box.innerHTML=`<strong>${yesPercent}% YES</strong> / ${noPercent}% NO<br>${total} total vote${total===1?"":"s"}${locked}`;
}

async function submitVote(vote){
  const voteKey="sportsmistakes_vote_"+id;
  if(localStorage.getItem(voteKey)){alert("You already voted on this mistake.");updateDetailVoteButtons();return}
  let voterId=localStorage.getItem("sportsmistakes_voter_id");
  if(!voterId){voterId=crypto.randomUUID();localStorage.setItem("sportsmistakes_voter_id",voterId)}
  const buttons=document.querySelectorAll(".vote-buttons button");
  buttons.forEach(btn=>btn.disabled=true);
  const{error}=await client.from("mistake_votes").insert({mistake_id:id,vote:vote,voter_id:voterId});
  if(error){
    if(error.code==="23505"){
      localStorage.setItem(voteKey,"locked");
      alert("You already voted on this mistake.");
      updateDetailVoteButtons();
      await loadVotes();
      return;
    }
    buttons.forEach(btn=>btn.disabled=false);
    alert("Vote failed. Please try again.");console.error(error);return;
  }
  localStorage.setItem(voteKey,vote);
  await loadVotes();
}

function containsUnsafeText(text){
  const banned=[/\bfuck\b/i,/\bfucking\b/i,/\bshit\b/i,/\basshole\b/i,/\bbitch\b/i,/\bcunt\b/i,/\bmotherfucker\b/i,/\bporn\b/i,/\bxxx\b/i,/\bnude\b/i,/\bnudes\b/i,/\bnsfw\b/i,/\bkill yourself\b/i,/\bkys\b/i,/\bnazi\b/i,/\bhitler\b/i,/\bwhite power\b/i,/\bcasino\b/i,/\bcrypto\b/i,/\bbitcoin\b/i,/\btelegram\b/i,/\bwhatsapp\b/i,/\bviagra\b/i,/\bescort\b/i,/\byou are an idiot\b/i,/\byou're an idiot\b/i,/\bmoron\b/i];
  return banned.some(p=>p.test(text));
}

async function loadCourtArguments(){
  const p=document.getElementById("prosecutionArguments"),d=document.getElementById("defenseArguments");
  if(!p||!d||!id)return;
  const{data,error}=await client.from("sports_court_arguments").select("*").eq("mistake_id",id).eq("status","approved").order("upvotes",{ascending:false}).order("created_at",{ascending:false});
  if(error){console.error(error);p.innerHTML="Could not load arguments. Did you run the Sports Court SQL?";d.innerHTML="Could not load arguments.";return}
  const list=data||[];
  p.innerHTML=renderArguments(list.filter(a=>a.side==="prosecution"),"prosecution");
  d.innerHTML=renderArguments(list.filter(a=>a.side==="defense"),"defense");
}

function renderArguments(list,side){
  if(!list||list.length===0)return`<div class="court-note">No ${side} arguments yet. Be the first to make the case.</div>`;
  return list.map(arg=>`<div class="argument">
    <div class="argument-text">${escapeHtml(arg.argument_text||"")}</div>
    <div class="argument-meta">${escapeHtml(arg.author_name||"Anonymous fan")}${arg.created_at?" • "+new Date(arg.created_at).toLocaleDateString():""}</div>
    <div class="argument-actions">
      <button class="upvote-btn" onclick="upvoteArgument('${arg.id}')">👍 ${arg.upvotes||0}</button>
      <button class="argument-report-btn" onclick="toggleArgumentReport('${arg.id}')">⚑ Report</button>
    </div>
    <div class="argument-report-box" id="argumentReport-${arg.id}">
      <label>Why are you reporting this comment?</label>
      <select id="argumentReportReason-${arg.id}">
        <option value="Hate or hateful conduct">Hate or hateful conduct</option>
        <option value="Harassment or personal attack">Harassment or personal attack</option>
        <option value="Threat or encouragement of violence">Threat or encouragement of violence</option>
        <option value="Sexual or inappropriate content">Sexual or inappropriate content</option>
        <option value="Spam or advertising">Spam or advertising</option>
        <option value="Off-topic or disruptive">Off-topic or disruptive</option>
        <option value="False or misleading claim">False or misleading claim</option>
        <option value="Other">Other</option>
      </select>
      <label>Details (optional)</label>
      <textarea id="argumentReportDetails-${arg.id}" placeholder="Briefly explain the problem."></textarea>
      <button class="argument-report-submit" onclick="submitCourtArgumentReport('${arg.id}')">Submit Report</button>
      <div class="argument-report-message" id="argumentReportMessage-${arg.id}"></div>
    </div>
  </div>`).join("");
}

function obviousCourtJunkReason(value){
  const text=String(value||"").trim().toLowerCase();
  const words=text.replace(/https?:\/\/\S+/g," ").replace(/[^a-z0-9'\s-]/g," ").split(/\s+/).filter(Boolean);
  const profanity=new Set(["fuck","fucking","fucked","fucker","motherfucker","motherfucking","shit","shitty","bullshit","bitch","bitches","asshole","assholes","dick","dicks","cunt","cunts","bastard","bastards"]);
  const profanityCount=words.filter(word=>profanity.has(word)).length;
  const profanityRatio=profanityCount/Math.max(words.length,1);
  if(profanityCount>=5||(profanityCount>=3&&profanityRatio>=0.50)) return "Please make a constructive sports argument rather than submitting profanity.";
  const unique=new Set(words);
  if(words.length>=5&&unique.size<=2) return "Please make a clear sports argument rather than repeating the same words.";
  if(/(.)\1{6,}/i.test(text)||words.some(word=>word.length>=24&&!word.includes("-"))) return "That looks like gibberish. Please make a clear point about the sports event.";
  if(words.filter(word=>/[a-z]/i.test(word)).length<4) return "Please make a clear point about the play, decision, call, strategy, or historical context.";
  return "";
}

async function submitCourtArgument(){
  const msg=document.getElementById("courtMessage");
  const side=document.getElementById("courtSide").value;
  const text=document.getElementById("courtArgument").value.trim();
  const name=document.getElementById("courtName").value.trim()||"Anonymous fan";
  const button=document.querySelector('.court-form button[onclick="submitCourtArgument()"]');
  if(!text||text.length<20){msg.innerText="Please write a constructive argument of at least 20 characters.";return}
  if(text.length>800){msg.innerText="Please keep the argument under 800 characters.";return}
  if(name.length>60){msg.innerText="Please keep the name or nickname under 60 characters.";return}
  const immediateBlock=obviousCourtJunkReason(text+" "+(name==="Anonymous fan"?"":name));
  if(immediateBlock){msg.innerText=immediateBlock;return}
  const originalButtonText=button?button.innerText:"Submit Argument";
  if(button){button.disabled=true;button.innerText="Checking Safety..."}
  msg.innerText="Checking argument for safety...";
  try{
    const response=await fetch(`${SUPABASE_URL}/functions/v1/submit-court-argument`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`},
      body:JSON.stringify({mistake_id:id,side,argument_text:text,author_name:name})
    });
    const raw=await response.text();
    let result={};
    try{result=raw?JSON.parse(raw):{}}catch{result={success:false,error:"The safety service returned an invalid response."}}
    if(!response.ok||!result.success){
      console.error("Sports Court moderation rejected or failed:",result);
      msg.innerText=result.message||result.error||"This argument could not be submitted.";
      return;
    }
    document.getElementById("courtArgument").value="";
    document.getElementById("courtName").value="";
    msg.innerText=result.message||"Argument submitted for moderator review.";
    await loadCourtArguments();
  }catch(error){
    console.error("Sports Court submission failed:",error);
    msg.innerText="The safety check could not be completed. Please try again.";
  }finally{
    if(button){button.disabled=false;button.innerText=originalButtonText}
  }
}

function toggleArgumentReport(argumentId){
  const box=document.getElementById("argumentReport-"+argumentId);
  if(box)box.classList.toggle("open");
}

async function submitCourtArgumentReport(argumentId){
  const reportKey="sports_court_report_"+argumentId;
  const message=document.getElementById("argumentReportMessage-"+argumentId);
  if(localStorage.getItem(reportKey)){
    if(message)message.innerText="You already reported this comment.";
    return;
  }
  const reason=document.getElementById("argumentReportReason-"+argumentId)?.value||"Other";
  const details=document.getElementById("argumentReportDetails-"+argumentId)?.value.trim()||"";
  let reporterId=localStorage.getItem("sportsmistakes_reporter_id");
  if(!reporterId){reporterId=crypto.randomUUID();localStorage.setItem("sportsmistakes_reporter_id",reporterId)}
  if(message)message.innerText="Submitting report...";
  try{
    const response=await fetch(`${SUPABASE_URL}/functions/v1/report-court-argument`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`},
      body:JSON.stringify({argument_id:argumentId,reporter_id:reporterId,reason,details})
    });
    const raw=await response.text();
    let result={};
    try{result=raw?JSON.parse(raw):{}}catch{result={success:false,error:"The reporting service returned an invalid response."}}
    if(response.status===409){localStorage.setItem(reportKey,"true");if(message)message.innerText="You already reported this comment.";return}
    if(!response.ok||!result.success){if(message)message.innerText=result.error||result.message||"The report could not be submitted.";return}
    localStorage.setItem(reportKey,"true");
    if(message)message.innerText=result.message||"Report received. Thank you.";
    if(result.automatically_hidden) await loadCourtArguments();
  }catch(error){
    console.error("Sports Court report failed:",error);
    if(message)message.innerText="The reporting service could not be reached.";
  }
}

async function upvoteArgument(argumentId){
  const localVoteKey="sports_court_upvote_"+argumentId;
  if(localStorage.getItem(localVoteKey)){alert("You already upvoted this argument.");return}
  let voterId=localStorage.getItem("sportsmistakes_court_voter_id");
  if(!voterId){voterId=crypto.randomUUID();localStorage.setItem("sportsmistakes_court_voter_id",voterId)}
  try{
    const response=await fetch(`${SUPABASE_URL}/functions/v1/upvote-court-argument`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`},
      body:JSON.stringify({argument_id:argumentId,voter_id:voterId})
    });
    const raw=await response.text();
    let result={};
    try{result=raw?JSON.parse(raw):{}}catch{result={success:false,error:"The upvote service returned an invalid response."}}
    if(response.status===409||result.code==="already_upvoted"){
      localStorage.setItem(localVoteKey,"true");
      alert("You already upvoted this argument.");
      return;
    }
    if(!response.ok||!result.success){
      console.error("Sports Court upvote failed:",result);
      alert(result.message||result.error||"Could not upvote.");
      return;
    }
    localStorage.setItem(localVoteKey,"true");
    await loadCourtArguments();
  }catch(error){
    console.error("Sports Court upvote request failed:",error);
    alert("The upvote service could not be reached.");
  }
}


let lessonCategories=[];


function toggleLessonDropdown(){
  const panel=document.getElementById("lessonDropdownPanel");
  if(panel) panel.classList.toggle("open");
}

function updateLessonDropdownSummary(){
  const summary=document.getElementById("lessonDropdownSummary");
  if(!summary) return;
  const checked=[...document.querySelectorAll('.lesson-option input[type="checkbox"]:checked')];
  summary.textContent=checked.length ? `${checked.length} selected ▾` : "▾";
}

function getLessonVoterId(){
  let voterId=localStorage.getItem("sportsmistakes_lesson_voter_id");
  if(!voterId){
    voterId=crypto.randomUUID();
    localStorage.setItem("sportsmistakes_lesson_voter_id",voterId);
  }
  return voterId;
}

function selectedLessonCategoryIds(){
  return [...document.querySelectorAll('.lesson-option input[type="checkbox"]:checked')]
    .map(el=>Number(el.value))
    .filter(Number.isFinite);
}

function enforceLessonSelectionLimit(){
  const checked=selectedLessonCategoryIds();
  const boxes=[...document.querySelectorAll('.lesson-option input[type="checkbox"]')];
  boxes.forEach(box=>{
    if(!box.checked) box.disabled=checked.length>=3;
  });
  const msg=document.getElementById("lessonMessage");
  if(msg) msg.innerText=checked.length>=3?"Maximum 3 selected.":"";
  updateLessonDropdownSummary();
}

async function loadLessonCategoriesAndVotes(){
  const optionsBox=document.getElementById("lessonOptions");
  const resultsBox=document.getElementById("lessonResults");
  if(!optionsBox||!resultsBox||!id)return;

  const {data:categories,error:catError}=await client
    .from("lesson_categories")
    .select("id,name,display_order")
    .eq("active",true)
    .order("display_order",{ascending:true});

  if(catError){
    console.error(catError);
    optionsBox.innerHTML='<div class="lesson-empty">Could not load lesson categories.</div>';
    return;
  }

  lessonCategories=categories||[];
  const voterId=getLessonVoterId();

  const [{data:allVotes,error:voteError},{data:myVotes,error:myVoteError}] = await Promise.all([
    client.from("mistake_lesson_votes").select("lesson_category_id").eq("mistake_id",id),
    client.from("mistake_lesson_votes").select("lesson_category_id").eq("mistake_id",id).eq("voter_id",voterId)
  ]);

  if(voteError) console.error(voteError);
  if(myVoteError) console.error(myVoteError);

  const mySet=new Set((myVotes||[]).map(v=>Number(v.lesson_category_id)));

  optionsBox.innerHTML=lessonCategories.map(cat=>`
    <label class="lesson-option">
      <input type="checkbox" value="${cat.id}" ${mySet.has(Number(cat.id))?"checked":""} onchange="enforceLessonSelectionLimit()">
      <span>${escapeHtml(cat.name)}</span>
    </label>
  `).join("");

  enforceLessonSelectionLimit();
  renderLessonResults(allVotes||[]);
}

function renderLessonResults(votes){
  const box=document.getElementById("lessonResults");
  if(!box)return;

  const totalVotersByCategory=new Map();
  for(const vote of votes||[]){
    const key=Number(vote.lesson_category_id);
    totalVotersByCategory.set(key,(totalVotersByCategory.get(key)||0)+1);
  }

  const ranked=lessonCategories
    .map(cat=>({id:Number(cat.id),name:cat.name,count:totalVotersByCategory.get(Number(cat.id))||0}))
    .filter(row=>row.count>0)
    .sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));

  const totalSelections=ranked.reduce((sum,row)=>sum+row.count,0);

  if(!totalSelections){
    box.innerHTML='<div class="lesson-empty">No community lesson votes yet. Be the first to choose what this mistake teaches.</div>';
    return;
  }

  box.innerHTML=ranked.map(row=>{
    const pct=Math.round((row.count/totalSelections)*100);
    return `
      <div class="lesson-result-row">
        <div class="lesson-result-top">
          <span>${escapeHtml(row.name)}</span>
          <span>${pct}% · ${row.count}</span>
        </div>
        <div class="lesson-bar-track">
          <div class="lesson-bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }).join("");
}

async function submitLessonVotes(){
  const msg=document.getElementById("lessonMessage");
  const btn=document.getElementById("lessonSubmitBtn");
  const categoryIds=selectedLessonCategoryIds();

  if(categoryIds.length<1){
    msg.innerText="Choose at least 1 lesson.";
    return;
  }
  if(categoryIds.length>3){
    msg.innerText="Choose no more than 3 lessons.";
    return;
  }

  const voterId=getLessonVoterId();
  btn.disabled=true;
  msg.innerText="Saving your lessons...";

  const {data,error}=await client.rpc("submit_mistake_lesson_votes",{
    p_mistake_id:id,
    p_voter_id:voterId,
    p_category_ids:categoryIds
  });

  btn.disabled=false;

  if(error){
    console.error(error);
    msg.innerText="Could not save your lessons. Please try again.";
    return;
  }

  msg.innerText="Your lesson choices were saved.";
  const panel=document.getElementById("lessonDropdownPanel");
  if(panel) panel.classList.remove("open");
  await loadLessonCategoriesAndVotes();
}

async function loadRelatedMistakes(){
  const box=document.getElementById("relatedMistakes");

  const{data,error}=await client.from("mistakes").select("*").neq("id",id).or(`sport.eq.${currentMistake.sport},category.eq.${currentMistake.category},subcategory.eq.${currentMistake.subcategory}`).order("controversy_score",{ascending:false}).limit(6);
  if(error){console.error(error);box.innerHTML="Could not load related mistakes.";return}
  if(!data||data.length===0){box.innerHTML="No related mistakes yet.";return}
  box.innerHTML=`<div class="related-grid">${data.map(m=>{
    const art=m.artwork_url||m.ai_artwork_url||"";

          <span class="related-badge">${escapeHtml(m.sport||"Sport")}</span>
          <span class="related-score">${escapeHtml(m.controversy_score||0)}/100</span>

        <h3>${escapeHtml(m.title||"Untitled Mistake")}</h3>
        <div class="related-meta">${escapeHtml(meta)}</div>
        <div class="related-stats"><span>👁 ${formatNumber(m.views||0)}</span><span>🔥 ${escapeHtml(m.controversy_score||0)}/100</span></div>
        <div class="related-read">Read Story →</div>
      </div>

  }).join("")}</div>`;

function toggleReportBox(){
  const box=document.getElementById("reportBox");if(!box)return;
  box.style.display=box.style.display==="block"?"none":"block";
}

async function submitIssueReport(){
  const reportMessage=document.getElementById("reportMessage");
  const reportType=document.getElementById("reportType").value;
  const reportDetails=document.getElementById("reportDetails").value.trim();
  if(!reportDetails){reportMessage.innerText="Please add a short explanation.";return}
  reportMessage.innerText="Submitting report...";
  const {error}=await client.from("mistake_reports").insert({mistake_id:id,report_type:reportType,details:reportDetails,status:"open"});
  if(error){console.error(error);reportMessage.innerText="Report failed. Please try again.";return}
  reportMessage.innerText="Report received. Thank you for helping improve SportsMistakes.";
  document.getElementById("reportDetails").value="";
}

function formatNumber(n){
  const num=Number(n||0);
  if(num>=1000000)return(num/1000000).toFixed(num>=10000000?0:1)+"M";
  if(num>=1000)return num.toLocaleString();
  return String(num);
}

function escapeHtml(value){return String(value||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(value){return String(value||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("'","&#039;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
