(function(){

  const KEY="sportsmistakes_language";
  const VALID=new Set(["en","fr"]);

  function saved(){
    try{
      const v=localStorage.getItem(KEY);
      return VALID.has(v)?v:null;
    }catch(e){ return null; }
  }

  function browserLanguage(){
    const primary=String(
      (Array.isArray(navigator.languages)&&navigator.languages[0]) ||
      navigator.language || "en"
    ).toLowerCase();
    return primary.startsWith("fr")?"fr":"en";
  }

  function getLanguage(){ return saved() || browserLanguage(); }

  function setLanguage(lang){
    if(!VALID.has(lang)) return;
    try{ localStorage.setItem(KEY,lang); }catch(e){}
    document.documentElement.lang=lang;
    location.reload();
  }

  function field(record,name){
    if(!record) return "";
    if(getLanguage()==="fr"){
      const v=record[name+"_fr"];
      if(v!==null && v!==undefined && String(v).trim()!=="") return v;
    }
    return record[name] ?? "";
  }

  const PLACEHOLDER_FR={
    'Search mistakes, people, teams, or lessons like "leadership"...':

    "e.g. Buckner lets ball pass through his legs":

    "Focus on the play, decision, referee call, strategy, or historical context.":
      "Concentrez-vous sur le jeu, la décision, l’arbitrage, la stratégie ou le contexte historique.",
    "Anonymous fan":"Partisan anonyme",
    "Briefly explain what should be fixed.":"Expliquez brièvement ce qui devrait être corrigé."
  };

  function translateText(root=document){
    if(getLanguage()!=="fr" || !document.body) return;

    const walker=document.createTreeWalker(
      root===document ? document.body : root,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode(node){
          const p=node.parentElement;
          if(!p) return NodeFilter.FILTER_REJECT;
          if(["SCRIPT","STYLE","NOSCRIPT","OPTION"].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(node=>{
      const raw=node.nodeValue||"";
      const t=raw.trim();
      if(FR[t]) node.nodeValue=raw.replace(t,FR[t]);
    });

    document.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(el=>{
      const p=el.getAttribute("placeholder");
      if(PLACEHOLDER_FR[p]) el.setAttribute("placeholder",PLACEHOLDER_FR[p]);
    });

    document.querySelectorAll("select option").forEach(option=>{
      const original=option.dataset.enLabel || option.textContent.trim();
      if(!option.dataset.enLabel) option.dataset.enLabel=original;
      if(OPTION_FR[original]) option.textContent=OPTION_FR[original];
    });

    const kicker=document.querySelector(".home-fast-intro .museum-kicker");
    if(kicker) kicker.textContent="LE REGISTRE PARTICIPATIF DES ERREURS SPORTIVES";

    const h1=document.querySelector(".home-fast-intro h1");
    if(h1) h1.innerHTML='Apprendre des plus grandes <span>erreurs sportives</span> de l’histoire';

    const nomTitle=document.querySelector(".homepage-nominate-card h2");
    if(nomTitle) nomTitle.textContent="Proposer une erreur sportive";

    const nomCopy=document.querySelector(".homepage-nominate-card .nominate-title-row p");
    if(nomCopy) nomCopy.textContent="Quelle erreur mérite sa place dans le registre?";

    const searchKicker=document.querySelector(".top-search .engage-kicker");
    if(searchKicker) searchKicker.textContent="RECHERCHER DANS LE REGISTRE";

    const searchTitle=document.querySelector(".top-search h2");
    if(searchTitle) searchTitle.textContent="Trouver une erreur sportive";

    const searchCopy=document.querySelector(".top-search .search-topline p");
    if(searchCopy) searchCopy.textContent="Recherchez par moment, athlète, équipe, sport, année ou leçon.";

    const dailyKicker=document.querySelector(".daily-art-kicker");
    if(dailyKicker) dailyKicker.textContent="ŒUVRE DU JOUR";

    const brandTag=document.querySelector(".brand-tag");
    if(brandTag) brandTag.innerHTML="La base de données Internet<br>des erreurs sportives";

    document.querySelectorAll(".popular").forEach(el=>{
      [...el.childNodes].forEach(node=>{
        if(node.nodeType!==Node.TEXT_NODE) return;
        const raw=node.nodeValue||"";
        const t=raw.trim();
        if(t==="Popular searches:") node.nodeValue=raw.replace(t,"Recherches populaires :");
        if(t==="Learn from mistakes:") node.nodeValue=raw.replace(t,"Apprendre des erreurs :");
      });
    });

    const lessonMap={
      "Leadership":"Leadership","Preparation":"Préparation","Pressure":"Pression",
      "Communication":"Communication","Decision-making":"Prise de décision",
      "Risk":"Risque","Teamwork":"Travail d’équipe"
    };
    document.querySelectorAll(".learn-searches button").forEach(btn=>{
      const original=btn.dataset.enLabel || btn.textContent.trim();
      if(!btn.dataset.enLabel) btn.dataset.enLabel=original;
      if(lessonMap[original]) btn.textContent=lessonMap[original];
    });
  }

  function mountSelector(){
    const nav=document.querySelector(".nav-links") || document.querySelector(".top-nav");
    if(!nav || document.getElementById("smLanguageSwitch")) return;

    const current=getLanguage();
    const div=document.createElement("div");
    div.id="smLanguageSwitch";
    div.className="sm-language-switch";
    div.innerHTML=
      '<button type="button" data-lang="en" class="'+(current==="en"?"active":"")+'">EN</button>'+
      '<span aria-hidden="true">/</span>'+
      '<button type="button" data-lang="fr" class="'+(current==="fr"?"active":"")+'">FR</button>';

    div.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
    });
    nav.appendChild(div);
  }

  function styles(){
    if(document.getElementById("smLangStyle")) return;
    const s=document.createElement("style");
    s.id="smLangStyle";
    s.textContent=`
      .sm-language-switch{display:inline-flex;align-items:center;gap:5px;margin-left:4px;padding:5px 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.04);color:#a8b3c1;font:900 12px Arial,Helvetica,sans-serif;letter-spacing:.5px;white-space:nowrap}
      .sm-language-switch button{appearance:none;border:0;background:transparent;color:#a8b3c1;padding:3px 4px;margin:0;cursor:pointer;font:inherit;line-height:1}
      .sm-language-switch button.active{color:#fff}
      .sm-language-switch button:hover{color:#ff6464}
    `;
    document.head.appendChild(s);
  }

  window.SMLanguage={
    get:getLanguage,
    set:setLanguage,
    field:field,
    translate:translateText,
    optionLabel:function(english){ return getLanguage()==="fr" ? (OPTION_FR[english]||english) : english; },
    ui:function(english){ return getLanguage()==="fr" ? (FR[english]||english) : english; }
  };

  document.documentElement.lang=getLanguage();

  document.addEventListener("DOMContentLoaded",()=>{
    styles();
    mountSelector();
    translateText();
  });
})();
</script>

    }

    .vote-head{
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:center;
      flex-wrap:wrap;
    }

    .vote-head h2{
      margin:0;
      color:#fff;
      font-size:22px;
    }

    .vote-head p{
      margin:6px 0 0;
      color:#d8e4f2;
      font-size:15px;
    }

    .vote-buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .vote-buttons button{
      padding:12px 15px;
      border:none;
      border-radius:9px;
      color:#fff;
      font-weight:900;
      cursor:pointer;
      font-size:14px;
    }

    .yes-btn{background:var(--blue)}
    .no-btn{background:#444}

    #voteResults{
      margin-top:14px;
      color:#fff;
      font-size:16px;
      line-height:1.45;
    }

    .share-row{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .share-label{color:#d8e4f2;font-weight:800;margin-right:4px}

    .share-buttons{display:flex;flex-wrap:wrap;gap:10px}

    .share-buttons button,
    .share-buttons a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:42px;
      height:42px;
      border:none;
      border-radius:999px;
      color:#fff;
      text-decoration:none;
      font-weight:900;
      cursor:pointer;
      font-size:14px;
    }

    .share-x{background:#111}
    .share-facebook{background:#1877f2}
    .share-reddit{background:#ff4500}
    .share-copy{background:#555}
    .share-message{margin-top:10px;color:var(--gold);font-size:14px;font-weight:900}

    .content-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(390px,.95fr);
      border:1px solid var(--line);
      background:rgba(8,19,33,.75);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 18px 42px rgba(0,0,0,.35);
    }

    .story-panel,.court-panel{
      padding:28px;
      background:linear-gradient(180deg,rgba(13,27,46,.96),rgba(6,16,29,.94));
    }

    .story-panel{border-right:1px solid var(--line)}

    .story-section{
      padding-bottom:24px;
      margin-bottom:24px;
      border-bottom:1px solid rgba(216,224,234,.16);
    }

    .story-section:last-child{
      border-bottom:none;
      padding-bottom:0;
      margin-bottom:0;
    }

    .story-section h2,.court-panel h2,.sources-card h2,.related-card-wrap h2{
      color:var(--gold);
      margin:0 0 14px;
      font-size:22px;
      letter-spacing:.2px;
      text-transform:uppercase;
    }

    .story-section p,.court-intro{
      color:#edf5ff;
      line-height:1.7;
      font-size:17px;
      margin:0;
    }

    .team-pill{
      display:inline-block;
      background:rgba(30,144,255,.12);
      border:1px solid rgba(116,185,255,.32);
      color:#dbeafe;
      padding:12px 14px;
      border-radius:12px;
      font-weight:900;
      line-height:1.35;
    }

    .court-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:18px;
    }

    .court-side{
      background:rgba(3,10,20,.55);
      border:1px solid rgba(116,185,255,.26);
      border-radius:12px;
      padding:16px;
    }

    .court-side.prosecution{border-color:rgba(239,68,68,.45)}
    .court-side.defense{border-color:rgba(30,144,255,.45)}

    .court-side h3{
      margin:0 0 12px;
      font-size:17px;
      color:#fff;
    }

    .court-side.prosecution h3{color:#ff6464}
    .court-side.defense h3{color:#4da3ff}

    .argument{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.11);
      border-radius:10px;
      padding:12px;
      margin-bottom:10px;
    }

    .argument-text{
      color:#edf5ff;
      line-height:1.48;
      font-size:14px;
    }

    .argument-meta{
      margin-top:8px;
      color:#b7c7d9;
      font-size:12px;
    }

    .upvote-btn{
      margin-top:10px;
      background:#203852;
      color:#fff;
      border:none;
      border-radius:8px;
      padding:8px 10px;
      font-weight:900;
      cursor:pointer;
    }

    .upvote-btn:hover{background:var(--blue)}

    .court-note{
      color:#b7c7d9;
      font-size:14px;
      line-height:1.45;
    }

    .court-form{
      margin-top:18px;
      background:rgba(247,249,252,.08);
      border:1px solid rgba(216,224,234,.18);
      border-radius:13px;
      padding:16px;
    }

    .court-form h3{margin:0;color:#fff}
    .court-form label{display:block;margin-top:12px;color:#d8e4f2;font-weight:900}

    .court-form select,.court-form textarea,.court-form input{
      width:100%;
      box-sizing:border-box;
      margin-top:8px;
      padding:12px;
      border-radius:8px;
      border:1px solid rgba(216,224,234,.28);
      background:#07111f;
      color:#fff;
      font-size:15px;
    }

    .court-form textarea{min-height:95px;resize:vertical}

    .court-form button{
      margin-top:14px;
      background:var(--blue);
      color:#fff;
      border:none;
      border-radius:8px;
      padding:12px 16px;
      font-weight:900;
      cursor:pointer;
    }

    .court-message{
      margin-top:12px;
      color:var(--gold);
      font-size:14px;
      white-space:pre-wrap;
      font-weight:900;
    }

    .sources-card,.related-card-wrap{
      background:rgba(8,19,33,.86);
      border:1px solid var(--line);
      border-radius:16px;
      padding:24px 28px;
      box-shadow:0 14px 34px rgba(0,0,0,.26);
    }

    .sources a{
      display:inline-block;
      color:var(--blue2);
      text-decoration:none;
      margin-right:16px;
      margin-top:8px;
      font-weight:900;
    }

    .report-btn{
      background:#6b5b1e;
      color:white;
      border:none;
      border-radius:8px;
      padding:11px 14px;
      font-weight:900;
      cursor:pointer;
      margin-top:16px;
    }

    .report-box{
      display:none;
      margin-top:14px;
      background:rgba(247,249,252,.08);
      border:1px solid rgba(216,224,234,.18);
      border-radius:12px;
      padding:16px;
    }

    .report-box label{display:block;margin-top:12px;color:#d8e4f2;font-weight:900}

    .report-box select,.report-box textarea{
      width:100%;
      box-sizing:border-box;
      margin-top:8px;
      padding:11px;
      border-radius:8px;
      border:1px solid rgba(216,224,234,.28);
      background:#07111f;
      color:#fff;
      font-size:15px;
    }

    .report-box textarea{min-height:90px;resize:vertical}

    .report-submit{
      background:var(--blue);
      color:white;
      border:none;
      border-radius:8px;
      padding:11px 14px;
      font-weight:900;
      cursor:pointer;
      margin-top:12px;
    }

    .report-message{
      margin-top:10px;
      color:var(--gold);
      white-space:pre-wrap;
      font-weight:900;
    }

    .related-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:16px;
      margin-top:14px;
    }

    .related-card{
      background:rgba(13,22,32,.96);
      border:1px solid rgba(255,255,255,.14);
      border-radius:10px;
      overflow:hidden;
      cursor:pointer;
      color:#fff;
      box-shadow:0 8px 22px rgba(0,0,0,.25);
      transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
    }

    .related-card:hover{
      transform:translateY(-2px);
      border-color:rgba(226,36,36,.68);
      box-shadow:0 14px 30px rgba(0,0,0,.34);
    }

    .related-art{
      height:150px;
      background:
        radial-gradient(circle at 50% 30%,rgba(226,36,36,.45),transparent 35%),
        linear-gradient(135deg,#1f2937,#070b10);
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:900;
      text-align:center;
      padding:12px;
      font-size:30px;
    }

    .related-art.has-image{
      padding:0;
      overflow:hidden;
      background:#070b10;
    }

    .related-art img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
    }

    .related-body{padding:15px}

    .related-topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .related-badge{
      display:inline-block;
      font-size:11px;
      padding:4px 7px;
      border-radius:999px;
      background:rgba(226,36,36,.16);
      color:#ff6464;
      font-weight:900;
      text-transform:uppercase;
    }

    .related-score{
      display:inline-block;
      background:rgba(226,36,36,.18);
      color:#ff5555;
      padding:4px 7px;
      border-radius:7px;
      font-weight:900;
      font-size:12px;
      white-space:nowrap;
    }

    .related-card h3{
      font-size:20px;
      margin:6px 0 8px;
      line-height:1.15;
      color:#fff;
    }

    .related-meta{
      font-size:13px;
      color:#aab4c2;
      line-height:1.35;
      margin-bottom:10px;
    }

    .related-stats{
      display:flex;
      align-items:center;
      gap:12px;
      color:#ff5555;
      font-size:13px;
      font-weight:900;
      margin-top:10px;
    }

    .related-read{
      margin-top:12px;
      color:#fff;
      font-size:13px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.35px;
    }

    @media(max-width:1050px){
      .museum-hero{grid-template-columns:1fr;gap:20px}
      .gallery-side{min-height:auto}
      .hero-info{padding:0}
      .hero-title{font-size:42px}
      .content-grid{grid-template-columns:1fr}
      .story-panel{border-right:none;border-bottom:1px solid var(--line)}
    }

    @media(max-width:760px){
      .top-nav{height:auto;align-items:flex-start;flex-direction:column;gap:10px;padding:14px}
      .nav-links{gap:12px}.nav-links a{font-size:14px}
      .container{margin:20px auto 50px;padding:0 14px}
      .art-frame{padding:12px}
      .art-inner:not(.has-art){min-height:330px}
      .plaque{width:70%;min-width:220px}
      .museum-ropes{display:none}
      .hero-title{font-size:34px}
      .hero-subtitle{font-size:18px}
      .court-grid{grid-template-columns:1fr}
      .story-panel,.court-panel,.sources-card,.related-card-wrap{padding:20px}
    }


    /* SportsMistakes public design alignment — homepage visual system */
    :root{--bg:#05080c;--nav:#05080c;--panel:#0b1118;--panel2:#0e1620;--line:#243140;--blue:#e22424;--blue2:#ff6464;--gold:#e22424;--goldDark:#b91313;--red:#e22424;--white:#fff;--muted:#a8b3c1;--soft:#d7dee8;--ink:#f8fafc;--paper:#0b1118}
    body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(226,36,36,.18),transparent 30%),linear-gradient(180deg,#05080c 0%,#091017 45%,#05080c 100%);color:#f8fafc}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.55)),radial-gradient(circle at 30% 10%,rgba(255,255,255,.04),transparent 30%);z-index:-1}
    .top-nav{height:auto;min-height:88px;padding:18px 26px;background:rgba(5,8,12,.96);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);z-index:20}
    .brand-wrap{display:flex;align-items:center;gap:22px;cursor:pointer}
    .nav-brand{font-weight:1000;font-size:30px;line-height:.82;letter-spacing:-1px;text-transform:uppercase;color:#fff}
    .nav-brand span{color:var(--red)}
    .brand-tag{color:#e5e7eb;font-size:15px;line-height:1.35;border-left:1px solid rgba(255,255,255,.18);padding-left:22px}
    .nav-links{gap:28px}.nav-links a{color:#f4f4f5;font-weight:900;font-size:14px;letter-spacing:.8px;text-transform:uppercase}.nav-links a:hover{color:var(--red)}
    .container{max-width:1220px;margin:22px auto 70px;padding:0 22px}.detail-shell{gap:24px}.back-link{color:var(--red);text-transform:uppercase;letter-spacing:.5px;font-size:13px}
    .museum-hero{gap:42px;padding:18px 0 20px;border-bottom:1px solid rgba(255,255,255,.10)}.gallery-side{min-height:540px}.spotlight{background:radial-gradient(ellipse at center,rgba(226,36,36,.16),rgba(226,36,36,.04) 40%,transparent 72%)}
    .art-frame{box-shadow:0 30px 70px rgba(0,0,0,.58),inset 0 0 0 2px rgba(255,255,255,.18),inset 0 0 0 9px rgba(83,48,0,.42)}.art-inner{background:#070b10;border-color:#19110a;min-height:450px}.art-inner.has-art{min-height:0}.plaque{background:linear-gradient(180deg,#d5a846,#8c5b0a);border-color:#f3d27a}
    .score-box{background:rgba(226,36,36,.14);color:#ff6464;border:1px solid rgba(226,36,36,.40);box-shadow:none}.hero-kicker{color:#d7dee8}.badge{background:rgba(226,36,36,.16);color:#ff6464;box-shadow:none;text-transform:uppercase;letter-spacing:.5px}.hero-title{font-size:54px;letter-spacing:-1.8px}.hero-subtitle{color:#d7dee8}.hero-views{color:#ff6464}
    .vote-box,.content-grid,.sources-card,.related-card-wrap{background:rgba(9,15,22,.88);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 42px rgba(0,0,0,.30)}
    .story-panel,.court-panel{background:linear-gradient(180deg,rgba(13,22,32,.96),rgba(7,12,18,.96))}.story-panel{border-right-color:rgba(255,255,255,.12)}
    .story-section h2,.court-panel h2,.sources-card h2,.related-card-wrap h2{color:#fff}.story-section h2::after,.court-panel>h2::after,.sources-card h2::after,.related-card-wrap h2::after{content:"";display:block;width:44px;height:3px;background:var(--red);margin-top:9px;border-radius:999px}
    .story-section p,.court-intro{color:#eef2f7}.team-pill{background:rgba(226,36,36,.10);border-color:rgba(226,36,36,.30);color:#fff}.court-side{background:rgba(3,8,13,.58);border-color:rgba(255,255,255,.13)}.court-side.defense{border-color:rgba(255,255,255,.18)}.court-side.defense h3{color:#d7dee8}
    .upvote-btn{background:#243140}.upvote-btn:hover{background:var(--red)}.court-form button,.report-submit,.yes-btn{background:linear-gradient(135deg,var(--red),#c81010)}.no-btn{background:#303846}.sources a{color:#ff6464}.report-btn{background:#303846;border:1px solid rgba(255,255,255,.12)}
    .related-card{background:rgba(13,22,32,.90);border:1px solid rgba(255,255,255,.14);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.25);color:#fff}.related-card:hover{border-color:rgba(226,36,36,.65);box-shadow:0 14px 30px rgba(0,0,0,.36)}.related-art{height:155px;background:radial-gradient(circle at 50% 30%,rgba(226,36,36,.45),transparent 35%),linear-gradient(135deg,#1f2937,#070b10);background-size:cover;background-position:center;background-repeat:no-repeat}.related-card h3{font-size:20px;line-height:1.15;color:#fff}.related-meta{color:#aab4c2}.related-score{background:rgba(226,36,36,.18);color:#ff5555}.related-badge{background:rgba(226,36,36,.16);color:#ff6464}.related-stats{color:#ff5555}.related-read{color:#fff}
    @media(max-width:760px){.top-nav{padding:16px 18px}.brand-tag{display:none}.nav-links{gap:14px}.nav-brand{font-size:27px}.hero-title{font-size:36px}.art-inner.has-art{min-height:0;padding:0}.main-artwork{width:100%;height:auto;object-fit:contain}}

  
    /* =========================================================
       FAN VERDICT + COMMUNITY "WHY?" LEARNING PANEL
       Restored from the working SportsMistakes community-learning system.
       ========================================================= */
    .verdict-combined{
      max-width:600px;
      width:100%;
    }

    .verdict-vote{
      padding-bottom:17px;
    }

    .verdict-results-wrap{
      display:flex;
      align-items:center;
      gap:14px;
      margin-top:12px;
    }

    .vote-pie{
      width:82px;
      height:82px;
      flex:0 0 82px;
      border-radius:50%;
      background:conic-gradient(#e22424 0deg 0deg,#475569 0deg 360deg);
      border:3px solid rgba(255,255,255,.14);
      box-shadow:0 8px 18px rgba(0,0,0,.28);
      position:relative;
    }

    .vote-pie::after{
      content:"";
      position:absolute;
      inset:23px;
      border-radius:50%;
      background:#0b1118;
      border:1px solid rgba(255,255,255,.08);
    }

    .verdict-learn{
      border-top:1px solid rgba(255,255,255,.13);
      padding-top:17px;
    }

    .verdict-learn-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .verdict-learn h2{
      margin:0;
      color:#fff;
      font-size:19px;
    }

    .verdict-learn-head p{
      margin:5px 0 12px;
      color:#cbd5e1;
      font-size:13px;
    }

    .verdict-learn-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      align-items:start;
    }

    .lesson-picker,
    .lesson-results{
      background:rgba(3,10,20,.50);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      padding:12px;
    }

    .lesson-picker-note{
      color:#b7c7d9;
      font-size:12px;
      line-height:1.4;
      margin-bottom:11px;
    }

    .lesson-dropdown-toggle{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      background:#07111f;
      color:#fff;
      border:1px solid rgba(226,36,36,.38);
      border-radius:9px;
      padding:11px 12px;
      font-weight:900;
      cursor:pointer;
      text-align:left;
    }

    .lesson-dropdown-panel{
      display:none;
      margin-top:9px;
      padding-top:9px;
      border-top:1px solid rgba(255,255,255,.10);
    }

    .lesson-dropdown-panel.open{display:block}

    .lesson-options{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }

    .lesson-option{
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px 10px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:9px;
      background:rgba(255,255,255,.045);
      color:#edf5ff;
      cursor:pointer;
      font-size:12px;
      font-weight:800;
      line-height:1.25;
    }

    .lesson-option:hover{
      border-color:rgba(226,36,36,.52);
    }

    .lesson-option input{
      accent-color:#e22424;
      width:16px;
      height:16px;
      flex:0 0 auto;
    }

    .lesson-option input:disabled + span{
      opacity:.55;
    }

    .lesson-submit{
      margin-top:12px;
      background:linear-gradient(135deg,var(--red),#c81010);
      color:#fff;
      border:none;
      border-radius:8px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
    }

    .lesson-submit:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .lesson-message{
      margin-top:8px;
      color:#ffcc00;
      font-size:12px;
      font-weight:900;
      min-height:15px;
    }

    .lesson-results-title{
      color:#fff;
      font-size:14px;
      font-weight:900;
      margin-bottom:10px;
      text-transform:uppercase;
      letter-spacing:.35px;
    }

    .lesson-result-row{
      margin-bottom:9px;
    }

    .lesson-result-row:last-child{
      margin-bottom:0;
    }

    .lesson-result-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:#edf5ff;
      font-size:12px;
      font-weight:900;
      margin-bottom:5px;
    }

    .lesson-result-top span:last-child{
      white-space:nowrap;
      color:#cbd5e1;
    }

    .lesson-bar-track{
      width:100%;
      height:9px;
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.08);
    }

    .lesson-bar-fill{
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#e22424,#ff6464);
      min-width:2px;
    }

    .lesson-empty{
      color:#9fb0c3;
      font-size:12px;
      line-height:1.45;
    }

    @media(min-width:1180px){
      .verdict-learn-grid{
        grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
      }
    }

    @media(max-width:760px){
      .vote-pie{width:70px;height:70px;flex-basis:70px}
      .vote-pie::after{inset:19px}
      .lesson-options{grid-template-columns:1fr}
    }



    /* =========================================================
       SPORTSMISTAKES ONE-SCREEN DETAIL LAYOUT — DESKTOP + MOBILE
       Desktop: page itself stays inside the viewport; secondary material uses tabs.
       Mobile/tablet: natural vertical scroll with the same information and controls.

        keepalive:true

      console.warn("SportsMistakes analytics event was not recorded:",error);

    const isMistake=/\/mistake\.html$/i.test(location.pathname);

async function loadVotes(){
  const box=document.getElementById("voteResults");
  const pie=document.getElementById("votePie");
  if(!box||!id)return;

  const{data,error}=await client.from("mistake_votes").select("vote").eq("mistake_id",id);
  if(error){
    box.innerText=smText("Could not load votes.","Impossible de charger les votes.");
    console.error(error);
    return;
  }

  const votes=data||[];
  const total=votes.length;
  const yes=votes.filter(v=>v.vote==="yes").length;
  const no=votes.filter(v=>v.vote==="no").length;
  const yesPercent=total?Math.round((yes/total)*100):0;
  const noPercent=total?100-yesPercent:0;
  const yesDegrees=Math.round((yesPercent/100)*360);

  if(pie){
    pie.style.background=total
      ? `conic-gradient(#e22424 0deg ${yesDegrees}deg,#64748b ${yesDegrees}deg 360deg)`
      : "conic-gradient(#334155 0deg 360deg)";
    pie.setAttribute(
      "aria-label",
      total
        ? smText(`${yesPercent}% yes, ${noPercent}% no`,`OUI ${yesPercent} %, NON ${noPercent} %`)
        : smText("No Fan Verdict votes yet","Aucun vote au verdict des partisans")
    );
    pie.title=pie.getAttribute("aria-label");
  }

  if(total===0){
    box.innerHTML=smText(
      "No votes yet.<br>Be the first to judge.",
      "Aucun vote pour le moment.<br>Soyez le premier à juger."
    );
    return;
  }

  box.innerHTML=smText(
    `<strong>${yesPercent}% YES</strong> / ${noPercent}% NO<br>${total} total vote${total===1?"":"s"}`,
    `<strong>${yesPercent}% OUI</strong> / ${noPercent}% NON<br>${total} vote${total===1?"":"s"} au total`
  );
}

async function submitVote(vote){
  const voteKey="sportsmistakes_vote_"+id;
  if(localStorage.getItem(voteKey)){alert("You already voted on this mistake.");return}
  let voterId=localStorage.getItem("sportsmistakes_voter_id");
  if(!voterId){voterId=crypto.randomUUID();localStorage.setItem("sportsmistakes_voter_id",voterId)}
  const{error}=await client.from("mistake_votes").insert({mistake_id:id,vote:vote,voter_id:voterId});
  if(error){alert("Vote failed. Please try again.");console.error(error);return}
  localStorage.setItem(voteKey,vote);
  await loadVotes();
}

function getLessonVoterId(){
  let voterId=localStorage.getItem("sportsmistakes_lesson_voter_id");
  if(!voterId){
    voterId=(globalThis.crypto&&crypto.randomUUID)
      ? crypto.randomUUID()
      : "sm-lesson-"+Date.now()+"-"+Math.random().toString(36).slice(2);

function enforceLessonSelectionLimit(){

async function loadLessonCategoriesAndVotes(){
  const optionsBox=document.getElementById("lessonOptions");
  const resultsBox=document.getElementById("lessonResults");
  if(!optionsBox||!resultsBox||!id)return;

  const {data:categories,error:catError}=await client
    .from("lesson_categories")
    .select("id,name,display_order")
    .eq("active",true)
    .order("display_order",{ascending:true});

  if(catError){
    console.error(catError);
    optionsBox.innerHTML=`<div class="lesson-empty">${smText("Could not load reasons.","Impossible de charger les raisons.")}</div>`;
    resultsBox.innerHTML=`<div class="lesson-empty">${smText("Community results are temporarily unavailable.","Les résultats de la communauté sont temporairement indisponibles.")}</div>`;
    return;
  }

  lessonCategories=categories||[];
  const voterId=getLessonVoterId();

  const [{data:allVotes,error:voteError},{data:myVotes,error:myVoteError}] = await Promise.all([
    client.from("mistake_lesson_votes").select("lesson_category_id").eq("mistake_id",id),
    client.from("mistake_lesson_votes").select("lesson_category_id").eq("mistake_id",id).eq("voter_id",voterId)
  ]);

  if(voteError) console.error("Community reason votes could not be loaded:",voteError);
  if(myVoteError) console.error("This visitor's reason votes could not be loaded:",myVoteError);

  const mySet=new Set((myVotes||[]).map(v=>Number(v.lesson_category_id)));

  optionsBox.innerHTML=lessonCategories.map(cat=>`
    <label class="lesson-option">
      <input type="checkbox"
             value="${cat.id}"
             ${mySet.has(Number(cat.id))?"checked":""}
             onchange="enforceLessonSelectionLimit()">
      <span>${escapeHtml(smLessonLabel(cat.name))}</span>
    </label>
  `).join("");

  enforceLessonSelectionLimit();
  renderLessonResults(allVotes||[]);
}

function renderLessonResults(votes){
  const box=document.getElementById("lessonResults");
  if(!box)return;

  const countsByCategory=new Map();
  for(const vote of votes||[]){
    const key=Number(vote.lesson_category_id);
    countsByCategory.set(key,(countsByCategory.get(key)||0)+1);
  }

  const ranked=lessonCategories
    .map(cat=>({
      id:Number(cat.id),
      name:cat.name,
      count:countsByCategory.get(Number(cat.id))||0
    }))
    .filter(row=>row.count>0)
    .sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));

  const totalSelections=ranked.reduce((sum,row)=>sum+row.count,0);

  if(!totalSelections){
    box.innerHTML=`<div class="lesson-empty">${smText(
      "No community reasons yet. Be the first to choose what made this a mistake.",
      "Aucune raison communautaire pour le moment. Soyez le premier à indiquer ce qui en a fait une erreur."
    )}</div>`;
    return;
  }

  box.innerHTML=ranked.map(row=>{
    const pct=Math.round((row.count/totalSelections)*100);
    return `
      <div class="lesson-result-row">
        <div class="lesson-result-top">
          <span>${escapeHtml(smLessonLabel(row.name))}</span>
          <span>${pct}% · ${row.count}</span>
        </div>
        <div class="lesson-bar-track" aria-label="${escapeAttr(smLessonLabel(row.name))}: ${pct}%">
          <div class="lesson-bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }).join("");
}

async function submitLessonVotes(){
  const msg=document.getElementById("lessonMessage");
  const btn=document.getElementById("lessonSubmitBtn");
  const categoryIds=selectedLessonCategoryIds();

  if(categoryIds.length<1){
    msg.innerText=smText("Choose at least 1 reason.","Choisissez au moins 1 raison.");
    return;
  }

  if(categoryIds.length>3){
    msg.innerText=smText("Choose no more than 3 reasons.","Choisissez au maximum 3 raisons.");
    return;
  }

  const voterId=getLessonVoterId();
  btn.disabled=true;
  msg.innerText=smText("Saving your reasons...","Enregistrement de vos raisons...");

  const {error}=await client.rpc("submit_mistake_lesson_votes",{
    p_mistake_id:id,
    p_voter_id:voterId,
    p_category_ids:categoryIds
  });

  btn.disabled=false;

  if(error){
    console.error("Lesson/reason vote failed:",error);
    msg.innerText=smText(
      "Could not save your reasons. Please try again.",
      "Impossible d’enregistrer vos raisons. Veuillez réessayer."
    );
    return;
  }

  msg.innerText=smText("Your reasons were saved.","Vos raisons ont été enregistrées.");
  const panel=document.getElementById("lessonDropdownPanel");
  if(panel) panel.classList.remove("open");
  await loadLessonCategoriesAndVotes();
}

function containsUnsafeText(text){
  const banned=[/\bfuck\b/i,/\bfucking\b/i,/\bshit\b/i,/\basshole\b/i,/\bbitch\b/i,/\bcunt\b/i,/\bmotherfucker\b/i,/\bporn\b/i,/\bxxx\b/i,/\bnude\b/i,/\bnudes\b/i,/\bnsfw\b/i,/\bkill yourself\b/i,/\bkys\b/i,/\bnazi\b/i,/\bhitler\b/i,/\bwhite power\b/i,/\bcasino\b/i,/\bcrypto\b/i,/\bbitcoin\b/i,/\btelegram\b/i,/\bwhatsapp\b/i,/\bviagra\b/i,/\bescort\b/i,/\byou are an idiot\b/i,/\byou're an idiot\b/i,/\bmoron\b/i];
  return banned.some(p=>p.test(text));
}

async function loadCourtArguments(){
  const p=document.getElementById("prosecutionArguments"),d=document.getElementById("defenseArguments");
  if(!p||!d||!id)return;
  const{data,error}=await client.from("sports_court_arguments").select("*").eq("mistake_id",id).eq("status","approved").order("upvotes",{ascending:false}).order("created_at",{ascending:false});
  if(error){console.error(error);p.innerHTML="Could not load arguments. Did you run the Sports Court SQL?";d.innerHTML="Could not load arguments.";return}
  const list=data||[];
  p.innerHTML=renderArguments(list.filter(a=>a.side==="prosecution"),"prosecution");
  d.innerHTML=renderArguments(list.filter(a=>a.side==="defense"),"defense");
}

function renderArguments(list,side){
  if(!list||list.length===0)return`<div class="court-note">No ${side} arguments yet. Be the first to make the case.</div>`;
  return list.map(arg=>`<div class="argument"><div class="argument-text">${escapeHtml(arg.argument_text||"")}</div><div class="argument-meta">${escapeHtml(arg.author_name||"Anonymous fan")}${arg.created_at?" • "+new Date(arg.created_at).toLocaleDateString():""}</div><button class="upvote-btn" onclick="upvoteArgument('${arg.id}')">👍 ${arg.upvotes||0}</button></div>`).join("");
}

async function submitCourtArgument(){
  const msg=document.getElementById("courtMessage"),side=document.getElementById("courtSide").value,text=document.getElementById("courtArgument").value.trim(),name=document.getElementById("courtName").value.trim()||"Anonymous fan";
  if(!text||text.length<20){msg.innerText="Please write a constructive argument of at least 20 characters.";return}
  if(text.length>800){msg.innerText="Please keep the argument under 800 characters.";return}
  if(containsUnsafeText(text+" "+name)){msg.innerText="This argument appears to violate the safety rules. Please focus on the sports decision, play, call, or context.";return}
  msg.innerText="Submitting argument...";
  const{error}=await client.from("sports_court_arguments").insert({mistake_id:id,side:side,argument_text:text,author_name:name,status:"approved",upvotes:0});
  if(error){console.error(error);msg.innerText="Argument failed to submit. Check the SQL table and policies.";return}
  document.getElementById("courtArgument").value="";
  document.getElementById("courtName").value="";
  msg.innerText="Argument added to Sports Court.";
  await loadCourtArguments();
}

async function upvoteArgument(argumentId){
  const key="sports_court_upvote_"+argumentId;
  if(localStorage.getItem(key)){alert("You already upvoted this argument.");return}
  const{data,error}=await client.from("sports_court_arguments").select("upvotes").eq("id",argumentId).single();
  if(error||!data){console.error(error);alert("Could not upvote.");return}
  const{error:updateError}=await client.from("sports_court_arguments").update({upvotes:(data.upvotes||0)+1}).eq("id",argumentId);
  if(updateError){console.error(updateError);alert("Could not upvote.");return}
  localStorage.setItem(key,"true");
  await loadCourtArguments();
}

function formatNumber(n){
  const num=Number(n||0);
  if(num>=1000000)return(num/1000000).toFixed(num>=10000000?0:1)+"M";
  if(num>=1000)return num.toLocaleString();
  return String(num);
}

function escapeHtml(value){return String(value||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(value){return String(value||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("'","&#039;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
