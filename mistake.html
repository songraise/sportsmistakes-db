  const KEY="sportsmistakes_language";
  const VALID=new Set(["en","fr"]);

  function saved(){
    try{
      const v=localStorage.getItem(KEY);
      return VALID.has(v)?v:null;
    }catch(e){ return null; }
  }

  function browserLanguage(){
    const primary=String(
      (Array.isArray(navigator.languages)&&navigator.languages[0]) ||
      navigator.language || "en"
    ).toLowerCase();
    return primary.startsWith("fr")?"fr":"en";
  }

  function getLanguage(){ return saved() || browserLanguage(); }

  function setLanguage(lang){
    if(!VALID.has(lang)) return;
    try{ localStorage.setItem(KEY,lang); }catch(e){}
    document.documentElement.lang=lang;
    location.reload();
  }

  function field(record,name){
    if(!record) return "";
    if(getLanguage()==="fr"){
      const v=record[name+"_fr"];
      if(v!==null && v!==undefined && String(v).trim()!=="") return v;
    }
    return record[name] ?? "";
  }

    "e.g. Buckner lets ball pass through his legs":

    "Anonymous fan":"Partisan anonyme",
    "Briefly explain what should be fixed.":"Expliquez brièvement ce qui devrait être corrigé."
  };

  function translateText(root=document){
    if(getLanguage()!=="fr" || !document.body) return;

    const walker=document.createTreeWalker(
      root===document ? document.body : root,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode(node){
          const p=node.parentElement;
          if(!p) return NodeFilter.FILTER_REJECT;
          if(["SCRIPT","STYLE","NOSCRIPT","OPTION"].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

    const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(node=>{
      const raw=node.nodeValue||"";
      const t=raw.trim();
      if(FR[t]) node.nodeValue=raw.replace(t,FR[t]);
    });

    document.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(el=>{
      const p=el.getAttribute("placeholder");
      if(PLACEHOLDER_FR[p]) el.setAttribute("placeholder",PLACEHOLDER_FR[p]);
    });

    document.querySelectorAll("select option").forEach(option=>{
      const original=option.dataset.enLabel || option.textContent.trim();
      if(!option.dataset.enLabel) option.dataset.enLabel=original;
      if(OPTION_FR[original]) option.textContent=OPTION_FR[original];
    });

    const kicker=document.querySelector(".home-fast-intro .museum-kicker");
    if(kicker) kicker.textContent="LE REGISTRE PARTICIPATIF DES ERREURS SPORTIVES";

    const h1=document.querySelector(".home-fast-intro h1");
    if(h1) h1.innerHTML='Apprendre des plus grandes <span>erreurs sportives</span> de l’histoire';

    const nomTitle=document.querySelector(".homepage-nominate-card h2");
    if(nomTitle) nomTitle.textContent="Proposer une erreur sportive";

    const nomCopy=document.querySelector(".homepage-nominate-card .nominate-title-row p");
    if(nomCopy) nomCopy.textContent="Quelle erreur mérite sa place dans le registre?";

    const searchKicker=document.querySelector(".top-search .engage-kicker");
    if(searchKicker) searchKicker.textContent="RECHERCHER DANS LE REGISTRE";

    const searchTitle=document.querySelector(".top-search h2");
    if(searchTitle) searchTitle.textContent="Trouver une erreur sportive";

    const searchCopy=document.querySelector(".top-search .search-topline p");
    if(searchCopy) searchCopy.textContent="Recherchez par moment, athlète, équipe, sport, année ou leçon.";

    const dailyKicker=document.querySelector(".daily-art-kicker");
    if(dailyKicker) dailyKicker.textContent="ŒUVRE DU JOUR";

    const brandTag=document.querySelector(".brand-tag");
    if(brandTag) brandTag.innerHTML="La base de données Internet<br>des erreurs sportives";

    document.querySelectorAll(".popular").forEach(el=>{
      [...el.childNodes].forEach(node=>{
        if(node.nodeType!==Node.TEXT_NODE) return;
        const raw=node.nodeValue||"";
        const t=raw.trim();
        if(t==="Popular searches:") node.nodeValue=raw.replace(t,"Recherches populaires :");
        if(t==="Learn from mistakes:") node.nodeValue=raw.replace(t,"Apprendre des erreurs :");
      });
    });

    const lessonMap={
      "Leadership":"Leadership","Preparation":"Préparation","Pressure":"Pression",
      "Communication":"Communication","Decision-making":"Prise de décision",
      "Risk":"Risque","Teamwork":"Travail d’équipe"
    };
    document.querySelectorAll(".learn-searches button").forEach(btn=>{
      const original=btn.dataset.enLabel || btn.textContent.trim();
      if(!btn.dataset.enLabel) btn.dataset.enLabel=original;
      if(lessonMap[original]) btn.textContent=lessonMap[original];
    });
  }

  function mountSelector(){
    const nav=document.querySelector(".nav-links") || document.querySelector(".top-nav");
    if(!nav || document.getElementById("smLanguageSwitch")) return;

    const current=getLanguage();
    const div=document.createElement("div");
    div.id="smLanguageSwitch";
    div.className="sm-language-switch";
    div.innerHTML=
      '<button type="button" data-lang="en" class="'+(current==="en"?"active":"")+'">EN</button>'+
      '<span aria-hidden="true">/</span>'+
      '<button type="button" data-lang="fr" class="'+(current==="fr"?"active":"")+'">FR</button>';

    div.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
    });
    nav.appendChild(div);
  }

  function styles(){
    if(document.getElementById("smLangStyle")) return;
    const s=document.createElement("style");
    s.id="smLangStyle";
    s.textContent=`
      .sm-language-switch{display:inline-flex;align-items:center;gap:5px;margin-left:4px;padding:5px 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.04);color:#a8b3c1;font:900 12px Arial,Helvetica,sans-serif;letter-spacing:.5px;white-space:nowrap}

      .sm-language-switch button:hover{color:#ff6464}
    `;
    document.head.appendChild(s);

    get:getLanguage,
    set:setLanguage,
    field:field,
    translate:translateText,
    optionLabel:function(english){ return getLanguage()==="fr" ? (OPTION_FR[english]||english) : english; },
    ui:function(english){ return getLanguage()==="fr" ? (FR[english]||english) : english; }
  };

  document.documentElement.lang=getLanguage();

  document.addEventListener("DOMContentLoaded",()=>{
    styles();
    mountSelector();
    translateText();
  });
})();

<script>
const SUPABASE_URL="https://scwjlljurircxuufhqih.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjd2psbGp1cmlyY3h1dWZocWloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjUyMjcsImV4cCI6MjA5Njg0MTIyN30.WF0HRRb9mAkuOySjabTd8CZXVZRqF0MhMl0N2mafnns";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const params=new URLSearchParams(window.location.search);
const id=params.get("id");
let currentMistake=null;

function smField(record, field){
  if(window.SMLanguage && typeof window.SMLanguage.field === "function"){
    return window.SMLanguage.field(record, field);
  }
  return record?.[field] ?? "";
}

function smText(en,fr){
  return (window.SMLanguage && window.SMLanguage.get && window.SMLanguage.get()==="fr") ? fr : en;
}

function smLessonLabel(name){
  const labels={
    "Decision-making":"Prise de décision",
    "Preparation":"Préparation",
    "Communication":"Communication",
    "Leadership":"Leadership",
    "Accountability":"Responsabilisation",
    "Handling pressure":"Gestion de la pression",
    "Teamwork":"Travail d’équipe",
    "Risk management":"Gestion du risque",

    "Integrity / ethics":"Intégrité / éthique",
    "Adaptability":"Adaptabilité",
    "Coaching / strategy":"Entraînement / stratégie",
    "Emotional control":"Maîtrise des émotions",
    "Attention to detail":"Attention aux détails",
    "Other":"Autre"
  };
  return (window.SMLanguage && window.SMLanguage.get && window.SMLanguage.get()==="fr")
    ? (labels[name]||name)
    : name;
}

function cleanMetaText(value,max=170){
  const text=String(value||"")
    .replace(/\s+/g," ")
    .replace(/<[^>]*>/g,"")
    .trim();
  if(text.length<=max) return text;
  return text.slice(0,max-1).replace(/\s+\S*$/,"")+"…";
}

function setMetaContent(selector,value){
  const el=document.querySelector(selector);
  if(el && value) el.setAttribute("content",value);
}

function updateMistakeSEO(m){
  if(!m)return;

  const title=cleanMetaText(smField(m,"title")||"Sports Mistake",110);
  const sport=cleanMetaText(m.sport||"",40);
  const year=cleanMetaText(m.year||"",16);
  const description=cleanMetaText(
    smField(m,"summary") ||
    smField(m,"why_it_matters") ||
    smField(m,"lessons_learned") ||
    `Explore, judge and learn from ${title} on SportsMistakes.`,
    165
  );

  const canonical=`${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(m.id||id)}`;
  const artwork=m.artwork_url||m.ai_artwork_url||m.image_url||"";
  const browserTitle=`${title}${sport?` | ${sport}`:""} | SportsMistakes`;

  document.title=browserTitle;

  const desc=document.getElementById("smMetaDescription");
  if(desc) desc.setAttribute("content",description);

  const canonicalEl=document.getElementById("smCanonical");
  if(canonicalEl) canonicalEl.setAttribute("href",canonical);

  setMetaContent("#smOgTitle",browserTitle);
  setMetaContent("#smOgDescription",description);
  setMetaContent("#smOgUrl",canonical);
  if(artwork) setMetaContent("#smOgImage",artwork);

  setMetaContent("#smTwitterTitle",browserTitle);
  setMetaContent("#smTwitterDescription",description);
  if(artwork) setMetaContent("#smTwitterImage",artwork);

  const structured={
    "@context":"https://schema.org",
    "@type":"Article",
    "headline":title,
    "description":description,
    "mainEntityOfPage":{"@type":"WebPage","@id":canonical},
    "publisher":{
      "@type":"Organization",
      "name":"SportsMistakes",
      "url":"https://sportsmistakes.com/"
    },
    "about":[
      sport,
      m.league||"",
      m.category||"",
      m.subcategory||"",
      m.teams_people||""
    ].filter(Boolean),
    "keywords":[
      "sports mistakes",
      sport,
      m.league||"",
      m.category||"",
      m.subcategory||"",
      year
    ].filter(Boolean).join(", ")
  };

  if(artwork) structured.image=[artwork];

  const ld=document.getElementById("smStructuredData");
  if(ld) ld.textContent=JSON.stringify(structured);
}

function normalizeComparableText(value){
  return String(value || "")
    .toLowerCase()
    .replace(/[^a-z0-9\u00c0-\u024f]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function shouldShowLearningCard(record){
  const lesson = smField(record,"lessons_learned");
  if(!lesson || !String(lesson).trim()) return false;

  const why = smField(record,"why_it_matters");
  if(!why || !String(why).trim()) return true;

  const lessonNorm = normalizeComparableText(lesson);
  const whyNorm = normalizeComparableText(why);

  if(!lessonNorm) return false;
  if(lessonNorm === whyNorm) return false;

  // Hide near-duplicates too, not just exact copies.
  if(lessonNorm.includes(whyNorm) || whyNorm.includes(lessonNorm)) return false;

  return true;
}

function getShortDeck(m){
  if(smField(m,"why_it_matters")) return String(smField(m,"why_it_matters")).split(".")[0].slice(0,150)+".";
  if(m.summary) return String(m.summary).split(".")[0].slice(0,150)+".";
  return "A debated moment from sports history.";
}

}

    <section class="smx-hero">

async function loadVotes(){
  const box=document.getElementById("voteResults");
  const pie=document.getElementById("votePie");
  if(!box||!id)return;

  const{data,error}=await client.from("mistake_votes").select("vote").eq("mistake_id",id);
  if(error){
    box.innerText=smText("Could not load votes.","Impossible de charger les votes.");
    console.error(error);
    return;
  }

  const votes=data||[];
  const total=votes.length;
  const yes=votes.filter(v=>v.vote==="yes").length;
  const no=votes.filter(v=>v.vote==="no").length;
  const yesPercent=total?Math.round((yes/total)*100):0;
  const noPercent=total?100-yesPercent:0;
  const yesDegrees=Math.round((yesPercent/100)*360);

  if(pie){
    pie.style.background=total
      ? `conic-gradient(#e02424 0deg ${yesDegrees}deg,#3d536a ${yesDegrees}deg 360deg)`
      : "conic-gradient(#334155 0deg 360deg)";
    pie.setAttribute(
      "aria-label",
      total
        ? smText(`${yesPercent}% yes, ${noPercent}% no`,`${yesPercent} % OUI, ${noPercent} % NON`)
        : smText("No votes yet","Aucun vote pour le moment")
    );
    pie.title=pie.getAttribute("aria-label");
  }

  if(total===0){
    box.innerHTML=smText(
      "No votes yet.<br>Be the first to judge.",
      "Aucun vote pour le moment.<br>Soyez le premier à juger."
    );
    return;
  }

  box.innerHTML=`<span class="y">${yesPercent}% ${smText("YES","OUI")}</span> · <span class="n">${noPercent}% ${smText("NO","NON")}</span><br><small style="font-size:13px;color:var(--smx-muted);font-weight:400">${total} ${smText(total===1?"total vote":"total votes",total===1?"vote au total":"votes au total")}</small>`;
}

async function submitVote(vote){
  const voteKey="sportsmistakes_vote_"+id;
  let voterId=localStorage.getItem("sportsmistakes_voter_id");
  if(!voterId){
    voterId=(globalThis.crypto&&crypto.randomUUID)
      ? crypto.randomUUID()
      : "sm-voter-"+Date.now()+"-"+Math.random().toString(36).slice(2);
    localStorage.setItem("sportsmistakes_voter_id",voterId);
  }

  const savedVote=localStorage.getItem(voteKey)||"";

  // If this browser has already voted on this mistake, CHANGE the existing
  // database row instead of blocking the visitor or creating a second vote.
  if(savedVote){
    if(savedVote===vote){
      await loadVotes();
      updateVoteButtons();
      updateDebateVoteHint();
      return;
    }

    const {data:updatedRows,error:updateError}=await client
      .rpc("change_mistake_vote",{
        p_mistake_id:id,
        p_voter_id:voterId,
        p_vote:vote
      });

    if(updateError){
      alert(smText("Vote change failed. Please try again.","La modification du vote a échoué. Veuillez réessayer."));
      console.error(updateError);
      return;
    }

    // A local vote can survive after a database reset/cleanup. If no matching
    // server row exists anymore, restore it as this visitor's single vote.
    if(!updatedRows || updatedRows.length===0){
      const {error:restoreError}=await client.from("mistake_votes").insert({
        mistake_id:id,
        vote:vote,
        voter_id:voterId
      });
      if(restoreError){
        alert(smText("Vote change failed. Please try again.","La modification du vote a échoué. Veuillez réessayer."));
        console.error(restoreError);
        return;
      }
    }

    localStorage.setItem(voteKey,vote);
    await loadVotes();
    updateVoteButtons();
    updateDebateVoteHint();
    return;
  }

  const {error}=await client.from("mistake_votes").insert({
    mistake_id:id,
    vote:vote,
    voter_id:voterId
  });

  if(error){
    // If the database already has this browser's vote but localStorage was
    // cleared, recover that row by changing it rather than adding a duplicate.
    if(error.code==="23505") {
      const {error:updateError}=await client
        .rpc("change_mistake_vote",{
          p_mistake_id:id,
          p_voter_id:voterId,
          p_vote:vote
        });
      if(updateError){
        alert(smText("Vote failed. Please try again.","Le vote a échoué. Veuillez réessayer."));
        console.error(updateError);
        return;
      }
    } else {
      alert(smText("Vote failed. Please try again.","Le vote a échoué. Veuillez réessayer."));
      console.error(error);
      return;
    }
  }

  localStorage.setItem(voteKey,vote);
  await loadVotes();
  updateVoteButtons();
  updateDebateVoteHint();
}


let lessonCategories=[];

function getLessonVoterId(){
  let voterId=localStorage.getItem("sportsmistakes_lesson_voter_id");
  if(!voterId){
    voterId=(globalThis.crypto&&crypto.randomUUID)
      ? crypto.randomUUID()
      : "sm-lesson-"+Date.now()+"-"+Math.random().toString(36).slice(2);
    localStorage.setItem("sportsmistakes_lesson_voter_id",voterId);
  }
  return voterId;
}

function selectedLessonCategoryIds(){
  return [...document.querySelectorAll('.lesson-option input[type="checkbox"]:checked')]
    .map(el=>Number(el.value))
    .filter(Number.isFinite);
}

function enforceLessonSelectionLimit(){
  const checked=selectedLessonCategoryIds();
  const boxes=[...document.querySelectorAll('.lesson-option input[type="checkbox"]')];

  boxes.forEach(box=>{
    if(!box.checked) box.disabled=checked.length>=3;
    else box.disabled=false;
  });

  const msg=document.getElementById("lessonMessage");
  if(msg && !msg.dataset.saved){
    msg.innerText=checked.length>=3
      ? smText("Maximum 3 selected.","Maximum de 3 sélections.")
      : "";
  }
}

async function loadLessonCategoriesAndVotes(){
  const optionsBox=document.getElementById("lessonOptions");
  const resultsBox=document.getElementById("lessonResults");
  if(!optionsBox||!resultsBox||!id)return;

  const {data:categories,error:catError}=await client
    .from("lesson_categories")
    .select("id,name,display_order")
    .eq("active",true)
    .order("display_order",{ascending:true});

  if(catError){
    console.error(catError);
    optionsBox.innerHTML=`<div class="lesson-empty">${smText("Could not load reasons.","Impossible de charger les raisons.")}</div>`;
    resultsBox.innerHTML=`<div class="lesson-empty">${smText("Community results are temporarily unavailable.","Les résultats de la communauté sont temporairement indisponibles.")}</div>`;
    return;
  }

  lessonCategories=categories||[];
  const voterId=getLessonVoterId();

  const [{data:allVotes,error:voteError},{data:myVotes,error:myVoteError}] = await Promise.all([
    client.from("mistake_lesson_votes").select("lesson_category_id").eq("mistake_id",id),
    client.from("mistake_lesson_votes").select("lesson_category_id").eq("mistake_id",id).eq("voter_id",voterId)
  ]);

  if(voteError) console.error("Community reason votes could not be loaded:",voteError);
  if(myVoteError) console.error("This visitor's reason votes could not be loaded:",myVoteError);

  const mySet=new Set((myVotes||[]).map(v=>Number(v.lesson_category_id)));

  optionsBox.innerHTML=lessonCategories.map(cat=>`
    <label class="lesson-option">
      <input type="checkbox"
             value="${cat.id}"
             ${mySet.has(Number(cat.id))?"checked":""}
             onchange="enforceLessonSelectionLimit()">
      <span>${escapeHtml(smLessonLabel(cat.name))}</span>
    </label>
  `).join("");

  enforceLessonSelectionLimit();
  renderLessonResults(allVotes||[]);
}

function renderLessonResults(votes){
  const box=document.getElementById("lessonResults");
  if(!box)return;

  const countsByCategory=new Map();
  for(const vote of votes||[]){
    const key=Number(vote.lesson_category_id);
    countsByCategory.set(key,(countsByCategory.get(key)||0)+1);
  }

  const ranked=lessonCategories
    .map(cat=>({
      id:Number(cat.id),
      name:cat.name,
      count:countsByCategory.get(Number(cat.id))||0
    }))
    .filter(row=>row.count>0)
    .sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));

  const totalSelections=ranked.reduce((sum,row)=>sum+row.count,0);

  if(!totalSelections){
    box.innerHTML=`<div class="lesson-empty">${smText(
      "No community reasons yet. Be the first to choose what made this a mistake.",
      "Aucune raison communautaire pour le moment. Soyez le premier à indiquer ce qui en a fait une erreur."
    )}</div>`;
    return;
  }

  box.innerHTML=ranked.map(row=>{
    const pct=Math.round((row.count/totalSelections)*100);
    return `
      <div class="lesson-result-row">
        <div class="lesson-result-top">
          <span>${escapeHtml(smLessonLabel(row.name))}</span>
          <span>${pct}% · ${row.count}</span>
        </div>
        <div class="lesson-bar-track" aria-label="${escapeAttr(smLessonLabel(row.name))}: ${pct}%">
          <div class="lesson-bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }).join("");
}

async function submitLessonVotes(){
  const msg=document.getElementById("lessonMessage");
  const btn=document.getElementById("lessonSubmitBtn");
  const categoryIds=selectedLessonCategoryIds();

  if(msg) msg.dataset.saved="";

  if(categoryIds.length<1){
    if(msg) msg.innerText=smText("Choose at least 1 reason.","Choisissez au moins 1 raison.");
    return;
  }

  if(categoryIds.length>3){
    if(msg) msg.innerText=smText("Choose no more than 3 reasons.","Choisissez au maximum 3 raisons.");
    return;
  }

  const voterId=getLessonVoterId();
  if(btn) btn.disabled=true;
  if(msg) msg.innerText=smText("Saving your reasons...","Enregistrement de vos raisons...");

  const {error}=await client.rpc("submit_mistake_lesson_votes",{
    p_mistake_id:id,
    p_voter_id:voterId,
    p_category_ids:categoryIds
  });

  if(btn) btn.disabled=false;

  if(error){
    console.error("Lesson/reason vote failed:",error);
    if(msg) msg.innerText=smText(
      "Could not save your reasons. Please try again.",
      "Impossible d’enregistrer vos raisons. Veuillez réessayer."
    );
    return;
  }

  if(msg){
    msg.dataset.saved="true";
    msg.innerText=smText("Your reasons were saved.","Vos raisons ont été enregistrées.");
  }
  try{ localStorage.setItem("sportsmistakes_lesson_votes_"+id,JSON.stringify(categoryIds)); }catch(e){}
  await loadLessonCategoriesAndVotes();
}

function containsUnsafeText(text){
  const banned=[/\bfuck\b/i,/\bfucking\b/i,/\bshit\b/i,/\basshole\b/i,/\bbitch\b/i,/\bcunt\b/i,/\bmotherfucker\b/i,/\bporn\b/i,/\bxxx\b/i,/\bnude\b/i,/\bnudes\b/i,/\bnsfw\b/i,/\bkill yourself\b/i,/\bkys\b/i,/\bnazi\b/i,/\bhitler\b/i,/\bwhite power\b/i,/\bcasino\b/i,/\bcrypto\b/i,/\bbitcoin\b/i,/\btelegram\b/i,/\bwhatsapp\b/i,/\bviagra\b/i,/\bescort\b/i,/\byou are an idiot\b/i,/\byou're an idiot\b/i,/\bmoron\b/i];
  return banned.some(p=>p.test(text));
}

async function loadCourtArguments(){

    .from("sports_court_arguments")
    .select("*")
    .eq("mistake_id",id)
    .eq("status","approved")
    .order("upvotes",{ascending:false})

  if(error){

function renderQuickComments(list,side){

    return `<div class="simple-comment-empty">${
      side==="yes"

        : smText("No NO comments yet. Be the first.","Aucun commentaire NON pour le moment. Soyez le premier.")
    }</div>`;
  }

  return list.slice(0,2).map(arg=>`
    <div class="simple-comment">
      <div class="simple-comment-text">${escapeHtml(arg.argument_text||"")}</div>
      <div class="simple-comment-meta">${escapeHtml(arg.author_name||"Anonymous fan")}${arg.upvotes?` • 👍 ${arg.upvotes}`:""}</div>
    </div>
  `).join("");
}

async function submitQuickDebate(){
  const msg=document.getElementById("quickDebateMessage");
  const text=(document.getElementById("quickDebateText")?.value||"").trim();
  const name=(document.getElementById("quickDebateName")?.value||"").trim()||"Anonymous fan";

  if(!vote){
    msg.innerText=smText("Please vote YES or NO first.","Veuillez d’abord voter OUI ou NON.");
    const voteCard=document.getElementById("smx-vote");
    if(voteCard && typeof voteCard.scrollIntoView==="function") voteCard.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }

  if(text.length<8){
    msg.innerText=smText(
      "Please add a little more detail.",
      "Veuillez ajouter un peu plus de détails."
    );
    return;
  }

  if(text.length>800){
    msg.innerText=smText(
      "Please keep your comment under 800 characters.",
      "Veuillez limiter votre commentaire à 800 caractères."
    );
    return;
  }

  if(containsUnsafeText(text+" "+name)){
    msg.innerText=smText(
      "Please keep the comment focused on the sports decision, play, call or context.",
      "Veuillez garder le commentaire centré sur la décision, le jeu, l’appel ou le contexte sportif."
    );
    return;
  }

  msg.innerText=smText("Posting...","Publication...");
  const side=vote==="yes"?"prosecution":"defense";

  const {error}=await client.from("sports_court_arguments").insert({
    mistake_id:id,
    side,
    argument_text:text,
    author_name:name,
    status:"approved",
    upvotes:0
  });

  if(error){
    console.error(error);
    msg.innerText=smText("Could not post your comment. Please try again.","Impossible de publier votre commentaire. Veuillez réessayer.");
    return;
  }

  document.getElementById("quickDebateText").value="";
  document.getElementById("quickDebateName").value="";
  msg.innerText=smText("Your take was added.","Votre avis a été ajouté.");
  await loadCourtArguments();
}

async function loadRelatedMistakes(){
  const box=document.getElementById("relatedMistakes");
  if(!box||!currentMistake)return;
  const{data,error}=await client
    .from("mistakes")
    .select("*")
    .neq("id",id)
    .or(`sport.eq.${currentMistake.sport},category.eq.${currentMistake.category},subcategory.eq.${currentMistake.subcategory}`)
    .order("controversy_score",{ascending:false})
    .limit(6);
  if(error){console.error(error);box.innerHTML=smText("Could not load related mistakes.","Impossible de charger les erreurs connexes.");return}
  if(!data||data.length===0){box.innerHTML=smText("No related mistakes yet.","Aucune erreur connexe pour le moment.");return}
  box.innerHTML=`<div class="related-grid">${data.map(m=>{
    const art=m.artwork_url||m.ai_artwork_url||"";
    const meta=[m.year,m.league||"",m.category||""].filter(Boolean).join(" • ");
    const relatedArt=art
      ? `<div class="related-art has-image"><img src="${escapeAttr(art)}" alt="${escapeAttr(smField(m,"title")||"Related sports mistake artwork")}" loading="lazy" decoding="async"></div>`
      : `<div class="related-art">SportsMistakes</div>`;
    return `<div class="related-card" onclick="window.location.href='mistake.html?id=${m.id}'">
      ${relatedArt}
      <div class="related-body">
        <div class="related-topline">
          <span class="related-badge">${escapeHtml(m.sport||"Sport")}</span>
          <span class="related-score">🔥 ${escapeHtml(m.controversy_score||0)}/100</span>
        </div>
        <h3>${escapeHtml(smField(m,"title")||"Untitled Mistake")}</h3>
        <div class="related-meta">${escapeHtml(meta)}</div>
        <div class="related-stats"><span>👁 ${formatNumber(m.views||0)}</span></div>
        <div class="related-read">${smText("Read Story →","Lire l’histoire →")}</div>
      </div>
    </div>`
  }).join("")}</div>`;
  if(window.SMLanguage) window.SMLanguage.translate(box);
}

function toggleReportBox(){
  const box=document.getElementById("reportBox");if(!box)return;
  box.style.display=box.style.display==="block"?"none":"block";
}

async function submitIssueReport(){
  const reportMessage=document.getElementById("reportMessage");
  const reportType=document.getElementById("reportType").value;
  const reportDetails=document.getElementById("reportDetails").value.trim();
  if(!reportDetails){reportMessage.innerText=smText("Please add a short explanation.","Veuillez ajouter une courte explication.");return}
  reportMessage.innerText=smText("Submitting report...","Envoi du signalement...");
  const {error}=await client.from("mistake_reports").insert({mistake_id:id,report_type:reportType,details:reportDetails,status:"open"});
  if(error){console.error(error);reportMessage.innerText=smText("Report failed. Please try again.","Le signalement a échoué. Veuillez réessayer.");return}
  reportMessage.innerText=smText("Report received. Thank you for helping improve SportsMistakes.","Signalement reçu. Merci d’aider à améliorer SportsMistakes.");
  document.getElementById("reportDetails").value="";
}

function formatNumber(n){
  const num=Number(n||0);
  if(num>=1000000)return(num/1000000).toFixed(num>=10000000?0:1)+"M";
  if(num>=1000)return num.toLocaleString();
  return String(num);
}

function escapeHtml(value){return String(value||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(value){return String(value||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("'","&#039;").replaceAll("<","&lt;").replaceAll(">","&gt;")}

loadMistake();
</script>
